# The property tests' seed. proptest draws a random one by default, which
# would fail a pull request on a bug it did not touch; CI runs fixed seeds
# only (spec/engineering.md#no-fuzzing-or-random-seeds-in-ci,
# spec/decisions/random-seed-simulations.md). Set here, so that a local `cargo
# test` runs what CI runs. A seed in the environment takes precedence:
# `PROPTEST_RNG_SEED=<u64> cargo test` explores another, outside CI.
[env]
PROPTEST_RNG_SEED = "0"
# The bundled SQLite (rusqlite's `bundled`) without its memory statistics.
# Keeping them takes one lock for the whole process on every allocation SQLite
# makes, so databases on several threads wait for one another, as do those of
# several nodes in one process, each with a database of its own: a test's
# in-process daemons, or `cargo test`'s tests run side by side on threads.
# Nothing reads the statistics, and SQLite recommends
# turning them off. Set here, so that tests, CI and releases build the same
# SQLite.
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
