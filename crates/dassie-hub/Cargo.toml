[package]
name = "dassie-hub"
version = "0.2.8"
description = "Settlement hubs for Dassie as sans-IO code: the hub's rules, its ledger and operations, Simplex consensus, the escrow's payout sets, and a member's account and settlement scheme"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The simulated hub, for this crate's tests and the simulation runner,
# dassie-sim (spec/decisions/random-seed-simulations.md).
sim = ["dep:dassie-node-core"]

[dependencies]
dassie-identity = { path = "../dassie-identity" }
# The member's side: the hub's ledger in the node's books, its account as an
# external asset and its settlement scheme (spec/areas/hubs.md#the-members-side).
dassie-ledger = { path = "../dassie-ledger" }
dassie-settlement = { path = "../dassie-settlement" }
# The RNG trait of the scheme interface only: the caller injects it.
rand_core = { version = "0.10", default-features = false }
dassie-node-core = { path = "../dassie-node-core", features = ["testing"], optional = true }
dassie-oer = { path = "../dassie-oer", default-features = false, features = ["alloc"] }
# The escrow's transactions, keys and the records validators read.
dassie-xrpl = { path = "../dassie-xrpl" }
# BIP 32 on secp256k1 for payout keys
# (spec/designs/settlement-hubs.md#9-shutdown).
hmac = { version = "0.13", default-features = false }
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.11", default-features = false }
# Wipes the payout key's secret on drop (spec/areas/identity.md#handling-of-secrets).
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
dassie-hub = { path = ".", features = ["sim"] }
dassie-node-core = { path = "../dassie-node-core", features = ["testing"] }
dassie-xrpl = { path = "../dassie-xrpl", features = ["fake"] }
proptest = "1.12"
serde_json = "1.0.154"
