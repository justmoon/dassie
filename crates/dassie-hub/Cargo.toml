[package]
name = "dassie-hub"
version = "0.2.6"
description = "Settlement hubs for Dassie as sans-IO code: the hub's rules, its ledger and operations, Simplex consensus and the escrow's payout sets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dassie-identity = { path = "../dassie-identity" }
dassie-oer = { path = "../dassie-oer", default-features = false, features = ["alloc"] }
# The escrow's transactions, keys and the records validators read.
dassie-xrpl = { path = "../dassie-xrpl" }
# BIP 32 on secp256k1 for payout keys
# (spec/designs/settlement-hubs.md#9-shutdown).
hmac = { version = "0.13", default-features = false }
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
dassie-xrpl = { path = "../dassie-xrpl", features = ["fake"] }
proptest = "1.12"
serde_json = "1.0.154"
