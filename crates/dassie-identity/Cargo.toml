[package]
name = "dassie-identity"
version.workspace = true
description = "Dassie node identity: recovery phrases, seed paths, Ed25519 node keys and node IDs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dassie-oer = { path = "../dassie-oer", default-features = false }
# Ed25519 signing. `fast` keeps the precomputed basepoint tables, since
# simulations sign a lot; `zeroize` wipes the signing key on drop.
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize"] }
# Ed25519 verification by the ZIP-215 rules (spec/areas/identity.md#node-key),
# which dalek's `verify` does not follow. Built on the same curve25519-dalek.
ed25519-zebra = { version = "5.0", default-features = false }
# The master seed from a phrase's secret (spec/decisions/phrase-format.md).
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
# The RNG trait shared with ed25519-dalek 3. Only the trait: the caller
# injects the generator, so the crate never touches the OS RNG.
rand_core = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
# Points of small order and scalars, for the properties of verification.
curve25519-dalek = { version = "5.0", default-features = false }
proptest = "1.12"
serde_json = "1.0.154"
