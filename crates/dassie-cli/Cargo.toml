[package]
name = "dassie-cli"
version.workspace = true
description = "The dassie binary: daemon, init, update, verify-install and the market maker"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "dassie"
path = "src/main.rs"

[features]
# Trusts the test key of testdata/release instead of the release key, so
# tests can sign releases, and lets `DASSIE_SYSTEMCTL` name a stand-in for
# systemctl, so they can restart and roll back: never in a release.
test-key = []

[dependencies]
dassie-node = { path = "../dassie-node" }
dassie-node-core = { path = "../dassie-node-core" }
dassie-release = { path = "../dassie-release" }
# `dassie market-maker`: the target's feed, the market maker's XRPL keys
# from its nodes' passphrases, and the AMM pool it swaps through.
dassie-feed = { path = "../dassie-feed" }
dassie-base64url = { path = "../dassie-base64url" }
dassie-identity = { path = "../dassie-identity" }
dassie-xrpl = { path = "../dassie-xrpl" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
prost = "0.14.4"
# The few flags there are; clap would not pay its way.
lexopt = "0.3.2"
# The init wizard's prompts, in the original's style.
cliclack = "0.5.6"
tracing = "0.1.44"
# `dassie update`: the request method, the bundle's SHA-256, and reading
# the bundle, a gzipped tar, without unpacking it blindly.
http = "1"
sha2 = "0.11"
flate2 = "1"
tar = { version = "0.4", default-features = false }
# `dassie status` shows dates.
time = "0.3.55"
# `dassie market-maker`: its config and the rippled API are JSON, and it
# speaks to the XRPL server over a WebSocket, as the node does.
serde_json = "1.0.154"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Wipes a passphrase read from its file once the keys are derived.
zeroize = "1.9"
# `dassie setup` posts the node key to the node's own HTTPS listener, as
# the wallet does.
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"

[build-dependencies]
dassie-release = { path = "../dassie-release" }

[dev-dependencies]
tempfile = "3"
# The fake XRP Ledger the market maker's XRPL side is tested against.
dassie-node = { path = "../dassie-node", features = ["testing"] }
tokio = { version = "1.53.2", features = ["io-util"] }
dassie-release = { path = "../dassie-release", features = ["testing"] }
# The mirror the update tests serve, over TLS with testdata/tls's
# certificate.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
