[package]
name = "dassie-feed"
version.workspace = true
description = "Dassie's snapshots as a sans-IO core: a node's quotes and ladders per settlement method, signed, the padded request for one, pricing a swap from one, and when to make one"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dassie-identity = { path = "../dassie-identity" }
# Its `SECOND_MS`, for the schedule.
dassie-kit = { path = "../dassie-kit" }
dassie-oer = { path = "../dassie-oer", default-features = false, features = ["alloc"] }
# A method's tag: a truncated SHA-256 of its scheme's ID.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# Exact checks of the snapshot's numbers against their definitions.
num-bigint = "0.4"
proptest = "1.12"
serde_json = "1.0.154"
