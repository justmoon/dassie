[package]
name = "dassie-feed"
version = "0.2.5"
description = "Dassie's public rate feed as a sans-IO core: signed UDP datagrams, a bounded subscriber table proven by cookies, and when to publish"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dassie-identity = { path = "../dassie-identity" }
# Its `ClientKey`: subscribers are bounded per IPv4 address or IPv6 /56, as
# the node's other per-client limits are.
dassie-node-core = { path = "../dassie-node-core" }
dassie-oer = { path = "../dassie-oer", default-features = false, features = ["alloc"] }
# The address cookie: HMAC-SHA256 under a secret the caller injects.
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
proptest = "1.12"
serde_json = "1.0.154"
