[package]
name = "dassie-ilp"
version = "0.1.3"
description = "ILPv4 packets, addresses and timestamps, ILDCP and BTP 2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# JavaScript bindings (wasm-bindgen) for packet encoding and decoding.
wasm = ["dep:wasm-bindgen", "dassie-oer/alloc"]

[dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
dassie-oer = { path = "../dassie-oer", default-features = false }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
dassie-oer = { path = "../dassie-oer" }
proptest = "1.12"
serde_json = "1.0.154"
