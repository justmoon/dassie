[package]
name = "dassie-desktop"
version.workspace = true
description = "The Dassie desktop app: the owner's node in a window, as a periphery node"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "dassie-desktop"
path = "src/main.rs"

[dependencies]
dassie-node = { path = "../dassie-node" }
dassie-node-core = { path = "../dassie-node-core" }
rustix = { version = "1.1.5", features = ["fs", "process"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "signal", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
webkit2gtk = "2.0.2"

[build-dependencies]
tauri-build = "2.7.4"

[dev-dependencies]
tempfile = "3.27.0"
