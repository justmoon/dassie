[package]
name = "dassie-sim"
version = "0.2.0"
description = "Runs Dassie's simulations from seeds, to replay, explain and search for failures (D27). A developer tool; never released."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dassie-connector = { path = "../dassie-connector", features = ["sim"] }
dassie-node = { path = "../dassie-node", features = ["testing"] }
dassie-node-core = { path = "../dassie-node-core", features = ["testing"] }
dassie-peer = { path = "../dassie-peer", features = ["sim"] }
dassie-stream = { path = "../dassie-stream", features = ["sim"] }
# A seed when none is given.
getrandom = "0.4.3"
# The few arguments there are, as in dassie-cli.
lexopt = "0.3.2"
# A campaign's records, one JSON object per line.
serde_json = "1.0.154"
