[package]
name = "dassie-stream"
version = "0.2.6"
description = "STREAM (RFC 29) as sans-IO state machines: packets, crypto, connections and a server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# JavaScript bindings (wasm-bindgen), including dassie-ilp's packet codecs.
# Brings the platform RNG, used only at that edge.
wasm = [
  "dep:wasm-bindgen",
  "dep:getrandom",
  "getrandom/sys_rng",
  "getrandom/wasm_js",
  "dassie-ilp/wasm",
]
# The simulated client and server, for this crate's tests and the
# simulation runner, dassie-sim (spec/decisions/random-seed-simulations.md).
sim = ["dep:dassie-node-core", "dassie-oer/alloc"]

[dependencies]
getrandom = { version = "0.4.3", default-features = false, optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
# Without the default `getrandom` feature: the caller injects randomness.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
dassie-ilp = { path = "../dassie-ilp" }
dassie-node-core = { path = "../dassie-node-core", features = ["testing"], optional = true }
dassie-oer = { path = "../dassie-oer", default-features = false }
hmac = { version = "0.13", default-features = false }
# The RNG trait shared with dassie-identity and ed25519-dalek 3. Only the
# trait: the crate never touches the OS RNG.
rand_core = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }

[dev-dependencies]
# The OS RNG, for the interop example only.
getrandom = { version = "0.4.3", features = ["sys_rng"] }
dassie-node-core = { path = "../dassie-node-core", features = ["testing"] }
dassie-oer = { path = "../dassie-oer" }
dassie-stream = { path = ".", features = ["sim"] }
proptest = "1.12"
serde_json = "1.0.154"
