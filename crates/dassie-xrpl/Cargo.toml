[package]
name = "dassie-xrpl"
version = "0.2.9"
description = "The XRP Ledger for Dassie: wallets and secp256k1 keys, the transaction codec for XRP and tokens, account settings and signer lists, single- and multi-signing, the ledger's binary records with ledger headers, validations and manifests, branches in its hash trees, the UNL from signed validator lists and its quorum, skip lists and anchors on ledgers the UNL validated, and the state, transactions and history the account reads proven at them, a standalone verifier that proves any account's state and any transaction the same way, the rippled API, AMM pool prices, the testnet account as an external asset and the settlement scheme on it, sans-IO; and a fake ledger for tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# A model of the XRP Ledger, for simulations and tests (never in a release).
fake = []

[dependencies]
dassie-ledger = { path = "../dassie-ledger" }
dassie-settlement = { path = "../dassie-settlement" }
# Ed25519, as the original's ed25519 wallets sign (`sEd…` seeds).
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize"] }
# ECDSA on secp256k1, as the ledger's secp256k1 keys sign, with its
# signatures in strict DER (spec/areas/xrpl.md#keys-and-signatures).
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "0.17", default-features = false, features = ["der"] }
# SHA-512Half for hashes and keys, SHA-256 and RIPEMD-160 for account IDs.
sha2 = { version = "0.11", default-features = false }
ripemd = { version = "0.2", default-features = false }
# The rippled WebSocket API is JSON.
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
rand_core = { version = "0.10", default-features = false }

[dev-dependencies]
dassie-identity = { path = "../dassie-identity" }
dassie-node-core = { path = "../dassie-node-core", features = ["testing"] }
dassie-xrpl = { path = ".", features = ["fake"] }
proptest = "1.12"
serde_json = { version = "1.0.154" }
