[package]
name = "dassie-xrpl"
version = "0.1.3"
description = "The XRP Ledger for Dassie: wallets, the Payment codec, the rippled API and the testnet settlement scheme, sans-IO; and a fake ledger for tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# A model of the XRP Ledger, for simulations and tests (never in a release).
fake = []

[dependencies]
dassie-ledger = { path = "../dassie-ledger" }
dassie-settlement = { path = "../dassie-settlement" }
# Ed25519, as the original's ed25519 wallets sign (`sEd…` seeds).
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize"] }
# SHA-512Half for hashes and keys, SHA-256 and RIPEMD-160 for account IDs.
sha2 = { version = "0.11", default-features = false }
ripemd = { version = "0.2", default-features = false }
# The rippled WebSocket API is JSON.
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
rand_core = { version = "0.10", default-features = false }

[dev-dependencies]
dassie-identity = { path = "../dassie-identity" }
dassie-node-core = { path = "../dassie-node-core", features = ["testing"] }
dassie-xrpl = { path = ".", features = ["fake"] }
proptest = "1.12"
serde_json = { version = "1.0.154" }
