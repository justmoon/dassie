[package]
name = "dassie-peer"
version = "0.1.0"
description = "Dassie's peer protocol v1 as a sans-IO state machine: wire format, authentication, node table, link state, membership, peering and routing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dassie-identity = { path = "../dassie-identity" }
dassie-oer = { path = "../dassie-oer", default-features = false, features = ["alloc"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
# The RNG trait only: the caller injects the generator (D16).
rand_core = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
dassie-node-core = { path = "../dassie-node-core", features = ["testing"] }
proptest = "1.12"
rand_core = { version = "0.10", default-features = false }
serde_json = "1.0.154"
