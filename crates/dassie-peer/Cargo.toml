[package]
name = "dassie-peer"
version = "0.2.2"
description = "Dassie's peer protocol v1 as a sans-IO state machine: wire format, authentication, node table, link state, membership, peering and routing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The simulated network, for this crate's tests and the simulation runner,
# dassie-sim (spec/decisions/random-seed-simulations.md).
sim = ["dep:dassie-node-core"]

[dependencies]
dassie-identity = { path = "../dassie-identity" }
dassie-node-core = { path = "../dassie-node-core", features = ["testing"], optional = true }
dassie-oer = { path = "../dassie-oer", default-features = false, features = ["alloc"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
# The RNG trait only: the caller injects the generator
# (spec/decisions/tigerstyle.md).
rand_core = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
dassie-node-core = { path = "../dassie-node-core", features = ["testing"] }
dassie-peer = { path = ".", features = ["sim"] }
proptest = "1.12"
rand_core = { version = "0.10", default-features = false }
serde_json = "1.0.154"
