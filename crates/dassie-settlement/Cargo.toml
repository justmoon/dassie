[package]
name = "dassie-settlement"
version = "0.2.4"
description = "Settlement schemes for Dassie: the scheme interface, activation reconciliation and the stub module"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dassie-ledger = { path = "../dassie-ledger" }
# The RNG trait only: the caller injects the generator.
rand_core = { version = "0.10", default-features = false }

[dev-dependencies]
proptest = "1.12"
dassie-node-core = { path = "../dassie-node-core", features = ["testing"] }
