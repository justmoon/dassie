# cargo-nextest, which runs each crate's tests in the Nix checks
# (nix/rust): every test in its own process, all of them at once, so that a
# check takes as long as its build and its slowest test rather than the sum
# of its test binaries. A local `cargo test` runs the same tests.

# The Nix checks' profile (`--profile ci`).
[profile.ci]
# Every test runs, so that one run reports every failure.
fail-fast = false
# No retries: a test that passes only sometimes fails CI rather than hide.
retries = 0
# Sized from the slowest tests' times in CI's logs (nextest's `PASS [`
# lines), which stay under half a minute with every test of a crate running
# at once on a shared machine. A test still running after a minute, over
# twice the slowest, is named, and after two minutes, over four times the
# slowest, is stopped and fails, so that a hang fails its check in minutes
# rather than run until CI's timeout.
slow-timeout = { period = "60s", terminate-after = 2 }
# A failure's output at once, and again at the end beside the others.
failure-output = "immediate-final"
