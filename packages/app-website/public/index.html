<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dassie</title>
    <meta
      name="description"
      content="A multi-currency, zero-config, peer-to-peer, Interledger-enabled payment network."
    >
    <style>
    :root {
      color-scheme: light dark;
      --background: #fafaf7;
      --text: #1d1d1b;
      --muted: #6b6b66;
      --accent: #8a5a2b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #171715;
        --text: #ecece7;
        --muted: #9d9d96;
        --accent: #d9a46c;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 32rem;
      padding: 2rem 1rem;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 2.5rem;
    }
    p {
      margin: 0.75rem 0;
    }
    .tagline {
      color: var(--muted);
    }
    a {
      color: var(--accent);
    }
    </style>
  </head>
  <body>
    <main>
      <h1>Dassie</h1>
      <p class="tagline">
        A multi-currency, zero-config, peer-to-peer, Interledger-enabled payment
        network.
      </p>
      <p>
        Dassie is being rewritten. This site will return with the new
        implementation.
      </p>
      <p>
        <a href="https://github.com/justmoon/dassie">Follow along on GitHub</a>
      </p>
    </main>
  </body>
</html>
