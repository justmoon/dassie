# What every crate follows unless its own clippy.toml says otherwise. A
# crate's file replaces this one rather than adding to it, so the crates
# that do IO (dassie-node, dassie-cli) repeat what they keep of it.

# Functions stay short enough to read in one go
# (spec/decisions/tigerstyle.md).
too-many-lines-threshold = 70

# The protocol and state-machine crates are no_std, which already keeps
# clocks, the OS RNG, environment variables, threads and hash maps out of
# their code. These catch them in their tests too, which link std: a test
# that reads the clock is a test that can't be replayed
# (spec/decisions/tigerstyle.md).
disallowed-types = [
  { path = "std::collections::HashMap", reason = "random iteration order; use BTreeMap or a fixed table (spec/decisions/tigerstyle.md)" },
  { path = "std::collections::HashSet", reason = "random iteration order; use BTreeSet or a fixed table (spec/decisions/tigerstyle.md)" },
  { path = "std::time::SystemTime", reason = "time is an input, `now_ms` (spec/decisions/tigerstyle.md)" },
  { path = "std::time::Instant", reason = "time is an input, `now_ms` (spec/decisions/tigerstyle.md)" },
  { path = "getrandom::SysRng", reason = "randomness is injected, as an `RngCore` (spec/decisions/tigerstyle.md)" },
]
disallowed-methods = [
  { path = "std::env::var", reason = "configuration is an input (spec/decisions/tigerstyle.md)" },
  { path = "std::env::var_os", reason = "configuration is an input (spec/decisions/tigerstyle.md)" },
  { path = "std::thread::spawn", reason = "a state machine is driven from one thread (spec/decisions/tigerstyle.md)" },
]

# Assertions stay on in release builds (spec/decisions/tigerstyle.md).
disallowed-macros = [
  { path = "core::debug_assert", reason = "assertions stay on in release; use assert! (spec/decisions/tigerstyle.md)" },
  { path = "core::debug_assert_eq", reason = "assertions stay on in release; use assert_eq! (spec/decisions/tigerstyle.md)" },
  { path = "core::debug_assert_ne", reason = "assertions stay on in release; use assert_ne! (spec/decisions/tigerstyle.md)" },
]

# Tests may unwrap, index and panic: a panic there is a failed test.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
