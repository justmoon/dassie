syntax = "proto3";

package dassie.owner.v1;

// Founding a settlement hub as its sponsor
// (spec/areas/hubs.md#founding-a-hub), and the payout bundles the node
// keeps of each hub it is a member of (spec/areas/hubs.md#payout-bundles).
// The contract has no services: these methods are numbered in `Request`
// and `Response` (transport.proto) with the rest: FoundHub,
// DropHubFounding, ListHubFoundings and GetHubPayout.

// A validator the owner picked, by its node and where it is reached.
message HubFoundingInvite {
  // Its node ID.
  string node = 1;
  // Its endpoint, `host:port`, which its acceptance may name otherwise.
  string endpoint = 2;
}

// Where a founding stands.
enum HubFoundingStage {
  HUB_FOUNDING_STAGE_UNSPECIFIED = 0;
  // Asking each validator to accept the terms: every one must.
  HUB_FOUNDING_STAGE_ACCEPTING = 1;
  // The rules are fixed: asking each to sign their genesis.
  HUB_FOUNDING_STAGE_SIGNING = 2;
  // A quorum signed, the genesis certificate: handing it to each.
  HUB_FOUNDING_STAGE_CERTIFYING = 3;
  // A quorum runs the hub: setting up its escrow on the XRP Ledger, and
  // asking whether a quorum checked it.
  HUB_FOUNDING_STAGE_ESCROW = 4;
  // f + 1 validators say a quorum checked the escrow: the hub takes
  // deposits.
  HUB_FOUNDING_STAGE_FOUNDED = 5;
}

// A validator of a founding, and how far it went.
message HubFoundingValidator {
  string node = 1;
  string endpoint = 2;
  bool accepted = 3;
  bool signed = 4;
  bool running = 5;
  // It says a quorum checked the escrow.
  bool escrow_checked = 6;
  // Why it refused last, until it answers otherwise; empty if it did not.
  string refusal = 7;
}

// A hub the node founds.
message HubFounding {
  // The terms' nonce, as hex: the founding's name.
  string nonce = 1;
  HubFoundingStage stage = 2;
  // The hub's ID, as hex, once every validator accepted.
  string hub = 3;
  // The hub's rules in canonical OER, as hex, once fixed: what a member's
  // hub scheme config (`hub-xrpl-testnet-xrp`, or `hub-xrpl-xrp` on
  // mainnet) and a validator's file name.
  string rules = 4;
  // The escrow's address on the XRP Ledger.
  string escrow = 5;
  // Whether the payment that funds the escrow went out.
  bool escrow_funded = 6;
  // Whether the escrow is set up as the rules say.
  bool escrow_set_up = 7;
  repeated HubFoundingValidator validators = 8;
  // What stops it for now, if anything.
  string problem = 9;
  int64 started_unix_ms = 10;
}

// Founds a hub with these validators, all of which must accept, on the
// XRP Ledger network of the node's realm: the testnet, or mainnet in the
// live realm. Its escrow is funded from the node's XRP on that network.
// The terms are the starting ones but for what `terms` sets, as JSON
// (`{"asset":{...},"fees":{...},"limits":{...},"timers":{...}}`); a hub
// holds XRP unless `asset` names a token by its `currency` and `issuer`:
// DSUSD on the testnet, RLUSD on mainnet. INVALID_ARGUMENT for fewer than
// 4 or more than 16 validators, one named twice, terms that do not check,
// or a hub no settlement scheme joins; FAILED_PRECONDITION before setup,
// or while the node keeps as many foundings as it does.
message FoundHubRequest {
  repeated HubFoundingInvite validators = 1;
  string terms = 2;
  // What funds the escrow, in drops; the default if not set.
  optional uint64 escrow_funding_drops = 3;
  // The XRPL server the escrow is set up on; if empty, the server of the
  // node's XRP Ledger account on the realm's network.
  string xrpl_server = 4;
}

message FoundHubResponse {
  HubFounding founding = 1;
}

// Drops a founding: the node asks nothing more for it and sets up no
// escrow. Validators that run the hub run it still. NOT_FOUND if there is
// none.
message DropHubFoundingRequest {
  string nonce = 1;
}

message DropHubFoundingResponse {}

message ListHubFoundingsRequest {}

message ListHubFoundingsResponse {
  repeated HubFounding foundings = 1;
}

// A validator's payout bundle the node keeps.
message HubPayoutBundle {
  // The validator's place in the hub's rules.
  uint32 validator = 1;
  // The height of the final block the set pays out.
  uint64 height = 2;
  // How many transactions the set has.
  uint32 transactions = 3;
}

// The payout bundles of a hub the node is a member of, which validators
// sign once the hub ended or stalled. FAILED_PRECONDITION while no
// settlement hub scheme runs.
message GetHubPayoutRequest {
  // The hub, by its ID as HubStatus.hub_id gives it (hub_member.proto);
  // empty while the node is in one hub only. NOT_FOUND for a hub the node
  // is not in, INVALID_ARGUMENT for an ID that is not 64 hex digits, or
  // for none while it is in several.
  string hub_id = 1;
}

message GetHubPayoutResponse {
  // The hub's ID, as hex.
  string hub = 1;
  repeated HubPayoutBundle bundles = 2;
  // How many validators must sign one set.
  uint32 quorum = 3;
  // Once a quorum's bundles sign one set: the height it pays out.
  optional uint64 ready_height = 4;
  // Then, its transactions multi-signed, as hex, to submit to the XRP
  // Ledger in order.
  repeated string transactions = 5;
}
