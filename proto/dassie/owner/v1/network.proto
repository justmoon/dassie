syntax = "proto3";

package dassie.owner.v1;

// A node in the node table (spec/areas/network.md#node-table): what its link
// state says, and why it is in the table.
message NetworkNode {
  string id = 1;
  // Empty until its link state is known.
  string url = 2;
  string alias = 3;
  // Its link state's sequence, a timestamp in ms; 0 if unknown.
  uint64 sequence = 4;
  // Why the node is in the table. A node with no reason left is removed
  // after a grace period.
  bool is_self = 5;
  bool bootstrap = 6;
  // On a majority of the bootstrap nodes' lists.
  bool majority = 7;
  // Registered with this node, as a bootstrap node.
  bool registered = 8;
  bool peer = 9;
  // When its registration with this node lapses; 0 if not registered.
  int64 registered_until_unix_ms = 10;
  // Its first hops, if a route reaches it.
  repeated string first_hops = 11;
  // The neighbors its link state lists, by ID.
  repeated string neighbors = 12;
  // The settlement schemes its link state lists.
  repeated string settlement_schemes = 13;
  // How many hops away it is: 0 for this node; unset when no route
  // reaches it.
  optional uint32 distance = 14;
  PeerState peer_state = 15;
  bool banned = 16;
  // The peering, while there is one.
  NetworkPeer peering = 17;
  // In the core, as the signed data defines it
  // (spec/decisions/promotion-to-core.md).
  bool core = 18;
}

enum PeerState {
  PEER_STATE_UNSPECIFIED = 0;
  PEER_STATE_NONE = 1;
  // This node asked, and waits for the answer.
  PEER_STATE_REQUESTING = 2;
  PEER_STATE_PEERED = 3;
  PEER_STATE_TERMINATING = 4;
}

// Streams the node table: first all of it (`reset`), then the nodes that
// changed and those that left.
message SubscribeNodesRequest {}

message NodeTableEvent {
  bool reset = 1;
  // Nodes added or changed, whole.
  repeated NetworkNode upserted = 2;
  // IDs of nodes that left the table.
  repeated string removed = 3;
}

message ListNodesRequest {}

message ListNodesResponse {
  // By ID; without their neighbors, settlement schemes and peering, which
  // could pass the message limit: SubscribeNodes has them.
  repeated NetworkNode nodes = 1;
}

// A peering.
message NetworkPeer {
  string node = 1;
  int64 since_unix_ms = 6;
  // The last authenticated message from the peer.
  int64 last_seen_unix_ms = 7;
  // Whether the peer asked.
  bool inbound = 8;
  // "peered", or "terminating" while it is being ended
  // (spec/decisions/peering-lifecycle.md).
  string state = 9;
  // Why it is being ended, if it is: "owner", "unresponsive", "not-peered",
  // "short-of-room"
  // or "unspecified".
  string termination_reason = 10;
  // Whether this node lists the peer as a neighbor in its link state, so
  // others route through it: it is confirmed, and not held down.
  bool advertised = 11;
  // Whether the peer was heard from within the last 60 s. An offline peer
  // is not advertised, so no route goes through it; the peering stays
  // until it has been silent for a day (spec/decisions/peering-lifecycle.md).
  bool online = 15;
  // Its settlement methods, one per settlement hub both nodes are in
  // (spec/decisions/settlement-methods.md), in the order they were added,
  // except that dropping the first sorts those left by scheme ID. The
  // first is the one the peering was made on, until that is dropped.
  repeated PeerMethod methods = 16;
  // Where a downlink with a URL, which asks to be promoted by having one,
  // stands toward its promotion (spec/decisions/promotion-to-core.md);
  // unset for any other peer. Shown, not acted on yet.
  Promotion promotion = 17;
}

// Where a downlink stands toward its promotion to a core peer, as its uplink
// sees it (spec/decisions/promotion-to-core.md).
message Promotion {
  // The checks it does not pass yet: "registered", "standing",
  // "heartbeats", "room", "settled", "clock", "url", "https" or
  // "not-banned".
  repeated string pending = 1;
  // How long it has been in good standing without a break, in ms.
  uint64 standing_ms = 2;
  // Our heartbeats to it over the standing a promotion asks, and those it
  // answered.
  uint32 heartbeats_sent = 3;
  uint32 heartbeats_answered = 4;
  // Its most room in our books on a method, in the largest packets.
  uint64 room_packets = 5;
  // Whether it ever paid us a settlement of at least one largest packet.
  bool paid_us = 6;
  // How far its clock is ahead of ours, negative behind, as its link
  // states show; unset until one came straight from it.
  optional sint64 clock_skew_ms = 7;
  // Whether it answered at its URL, with its own link state, the last
  // time we checked; unset before the first check.
  optional bool url_answered = 8;
  // Whether it answered at its URL over HTTPS, with a certificate a public
  // authority issued and its own node ID, the last time we checked; unset
  // before the first check.
  optional bool https_answered = 9;
}

// A settlement method of a peering: a scheme the pair settles on, with its
// own accounts and credit (spec/decisions/settlement-methods.md).
message PeerMethod {
  // Its settlement scheme, for example "hub-xrpl-testnet-xrp".
  string scheme = 1;
  // The credit this node extends to the peer on it, in the scheme ledger's
  // units.
  uint64 credit_out = 2;
  // What this node owes the peer net on it, in the scheme ledger's units:
  // negative when the peer owes this node.
  int64 owed = 3;
  // Whether it is withdrawn: the room this node's books give the peer on
  // it has been short of a packet past the grace.
  bool withdrawn = 4;
  // Whether this node winds it down, as when its owner removes the scheme:
  // it takes no new packets from the peer, and is dropped once the peer
  // was asked to settle on it, within a bounded time.
  bool winding_down = 5;
}

message ListPeersRequest {}

message ListPeersResponse {
  // By node ID.
  repeated NetworkPeer peers = 1;
}

// A route: the ILP address prefix of a node, and the peers that lead to it
// on shortest paths.
message NetworkRoute {
  string node = 1;
  // For example "test.das.gstpa…".
  string prefix = 2;
  repeated string first_hops = 3;
  // How many hops away the node is.
  uint32 distance = 4;
}

// A route to one of this node's own endpoints.
message LocalRoute {
  // The endpoint's address.
  string prefix = 1;
  // For example "btp:3" or "local:0".
  string endpoint = 2;
  // Its ledger, for example "stub+usd".
  string ledger = 3;
}

message ListRoutesRequest {}

message ListRoutesResponse {
  // By node ID.
  repeated NetworkRoute routes = 1;
  // By prefix.
  repeated LocalRoute local_routes = 2;
}

// Streams the routes, whole, each time they change.
message SubscribeRoutesRequest {}

// This node's standing with one bootstrap node
// (spec/decisions/membership-economics.md).
message BootstrapStatus {
  string node = 1;
  // Whether its list, as last fetched, names this node.
  bool listed = 2;
  // When it last took this node's registration; 0 if not since start.
  int64 registered_at_unix_ms = 3;
  // When its list was last fetched; 0 if never.
  int64 list_fetched_unix_ms = 4;
}

message GetRegistrationStatusRequest {}

message GetRegistrationStatusResponse {
  // This node's ID.
  string node = 1;
  // One per configured bootstrap node.
  repeated BootstrapStatus bootstrap = 2;
  // Whether this node is on a majority of their lists: a member of the
  // network others peer with.
  bool member = 3;
  // Whether this node is in the core, as the signed data defines it
  // (spec/decisions/promotion-to-core.md).
  bool core = 4;
}

// Streams the registration status, whole, each time it changes.
message SubscribeRegistrationRequest {}

// Registers with a bootstrap node now, rather than when the node next
// would. NOT_FOUND if it is not a bootstrap node; FAILED_PRECONDITION
// before the node has a hostname, or while a registration with it is on
// its way.
message RegisterWithBootstrapRequest {
  string node = 1;
}

message RegisterWithBootstrapResponse {}

// Ends a peering, as its owner (spec/decisions/peering-lifecycle.md): the
// node first collects, privately, asking the peer to settle once more, then
// tells it; once the packets in flight are done it ends on both sides.
// Nothing else is settled for its end (spec/decisions/ending-a-peering.md):
// what is owed stays on the books. The pair does not peer again for a day.
message TerminatePeeringRequest {
  string node = 1;
}

message TerminatePeeringResponse {}

// Bans a node: it is never asked to peer, is refused when it asks, and a
// peering with it is ended.
message BanNodeRequest {
  string node = 1;
}

message BanNodeResponse {}

message UnbanNodeRequest {
  string node = 1;
}

message UnbanNodeResponse {}

message ListBansRequest {}

message ListBansResponse {
  // By ID. Only the owner bans (spec/decisions/own-fulfills.md).
  repeated string nodes = 1;
}

// The owner's settings for peers (spec/decisions/exchange-rates.md,
// spec/decisions/passive-rebalancing.md, spec/decisions/peer-swaps.md).
message PeerSettings {
  // The fee on what passes from one peer to another, in parts per million
  // of what comes in, rounded down: 0 to 100 000 (10%).
  uint32 connector_fee_ppm = 2;
  // The spread on what such a packet converts, in parts per million of
  // what goes out: 0 to 100 000.
  uint32 fx_spread_ppm = 3;
  // k, how far the owner's inventory moves the rate such a packet converts
  // at from spot, in parts per million: 0 (spot) to 100 000.
  uint32 rebalance_ppm = 4;
  // Whether the node offers swaps to its peers: it publishes snapshots of
  // its quotes to them, and converts their swaps. A periphery node offers
  // none, whatever this says. On for a new node.
  bool offer_swaps = 5;
  // Whether the node swaps with its peers: it reads their snapshots, and a
  // core node swaps by itself toward its curve's targets, a periphery node
  // only toward swap_targets. On for a new node.
  bool swapping = 6;
  // What a periphery node's own swaps aim for, each asset at most once:
  // none for a new node, and then it swaps only when its owner asks
  // (SwapWithPeer). A core node aims for its curve's targets, whatever
  // these say.
  repeated SwapTarget swap_targets = 7;
}

// A target of a periphery node's own swaps.
message SwapTarget {
  // The asset, by the ledger its holding counts toward: an owner book's,
  // or one of its own, never a settlement hub's, which counts with the
  // owner book that funds it. For example "xrpl-testnet-xrp+xrp".
  string ledger = 1;
  // Its share of what the node holds in the assets with a target, as a
  // weight in parts per million: 1 to 1 000 000. The weights count against
  // their sum, so they need not add up to a million.
  uint32 target_ppm = 2;
}

message GetPeerSettingsRequest {}

message GetPeerSettingsResponse {
  PeerSettings settings = 1;
}

// Every setting at once. INVALID_ARGUMENT when one is out of range, or a
// target names no asset, or one twice.
message SetPeerSettingsRequest {
  PeerSettings settings = 1;
}

message SetPeerSettingsResponse {
  PeerSettings settings = 1;
}

// What the node moved by swaps on one ledger since it started.
message SwapsMoved {
  // For example "stub+usd".
  string ledger = 1;
  // What the node paid there and its peers fulfilled.
  uint64 paid = 2;
  // What came back there: what the node's swap endpoint fulfilled.
  uint64 received = 3;
}

// What the swap service did since the node started
// (spec/areas/connector.md#the-swap-service), counted.
message GetSwapStatusRequest {}

message GetSwapStatusResponse {
  // Whether the node swaps by itself: a core node with swapping on, or a
  // periphery node with swap_targets too.
  bool by_itself = 1;
  // Peers whose snapshots it reads.
  uint64 peers = 2;
  // Swaps in flight, its own and the owner's.
  uint64 in_flight = 3;
  // Swaps sent.
  uint64 sent = 4;
  // Swaps the peer fulfilled.
  uint64 fulfilled = 5;
  // Swaps rejected.
  uint64 rejected = 6;
  // Swaps rejected whose way back the node had fulfilled: it was paid all
  // the same.
  uint64 paid_though_rejected = 7;
  // Times it backed off from a peer (T04, T05 and other temporary errors).
  uint64 backoffs = 8;
  // Times a peer refused swaps (F02 and other final errors).
  uint64 refused = 9;
  // Swaps that came back below their minimum.
  uint64 below_minimum = 10;
  // Swaps above a peer's largest packet (F08).
  uint64 too_large = 11;
  // Outcomes dropped unread, for want of room.
  uint64 dropped = 12;
  // By ledger.
  repeated SwapsMoved moved = 13;
  // Peers it backs off from now: it sends them nothing until the backoff
  // ends, and then looks at them again.
  uint64 backing_off = 14;
  // Peers it sends nothing until their snapshot changes, since they
  // refused a swap or one came back below its minimum.
  uint64 waiting_for_snapshot = 15;
}

// Swaps with a peer for the owner, as the node's own swaps go: from one
// method of the peering to another, priced by the peer's snapshot, which
// the node reads while swapping is on. Answers once it is done: it sends
// for a minute at most, and waits for what it has in flight, so a caller
// gives it a timeout of a few minutes. Cancelled, it sends no more; what
// it has in flight still resolves. INVALID_ARGUMENT when it is not a swap; NOT_FOUND when the
// peering has no available method on either scheme; FAILED_PRECONDITION
// when no snapshot of the peer prices the pair; RESOURCE_EXHAUSTED while
// too many of the owner's swaps run.
message SwapWithPeerRequest {
  // The peer, by node ID.
  string node = 1;
  // The scheme of the method it pays on, for example "stub".
  string pay_on = 2;
  // The scheme of the method it is paid back on.
  string back_on = 3;
  // The most it pays, in the units of pay_on's ledger.
  uint64 amount = 4;
  // The least it takes per unit it pays, in units of back_on's ledger:
  // rate_numerator / rate_denominator, neither of them 0: a rate of 0, as
  // one left out reads, is INVALID_ARGUMENT.
  uint64 rate_numerator = 5;
  uint64 rate_denominator = 6;
}

// Why a swap the owner asked for ended.
enum SwapEnd {
  SWAP_END_UNSPECIFIED = 0;
  // All of it was paid.
  SWAP_END_DONE = 1;
  // The peer's snapshot promises no more at the rate asked.
  SWAP_END_EXHAUSTED = 2;
  // The peer refused it (F02 or another final error).
  SWAP_END_REFUSED = 3;
  // Its time ran out, while it backed off or waited for a snapshot.
  SWAP_END_TIMED_OUT = 4;
}

message SwapWithPeerResponse {
  // What the peer took of what the node paid, on pay_on's ledger.
  uint64 paid = 1;
  // What came back, on back_on's ledger.
  uint64 received = 2;
  // Its packets fulfilled and rejected.
  uint64 fulfilled = 3;
  uint64 rejected = 4;
  SwapEnd ended = 5;
}

// The peers' snapshots the node's swaps are priced by, decoded
// (spec/areas/network.md#snapshot-subscriptions): each peer's latest while
// it counts, the first 64 by node ID, as the swap service reads them. The
// node subscribes to them only while swapping is on. A reader such as
// `dassie market-maker` swaps through its node by them
// (spec/areas/rate-feed.md#market-maker).
message ListPeerSnapshotsRequest {}

message ListPeerSnapshotsResponse {
  // By node ID.
  repeated PeerSnapshot snapshots = 1;
}

// A peer's quotes at one moment
// (spec/areas/rate-feed.md#what-a-snapshot-says), verified under its key
// when the node took it.
message PeerSnapshot {
  // The peer, by node ID.
  string node = 1;
  // When the peer made it, in milliseconds of its clock: each of its
  // snapshots has a larger one.
  uint64 sequence = 2;
  // When it stops counting.
  int64 valid_until_unix_ms = 3;
  // The drops each ladder's amounts are for, in basis points: eight,
  // strictly ascending, each below 10 000.
  repeated uint32 grid_bp = 4;
  // In ascending order of their tags.
  repeated SnapshotMethod methods = 5;
}

// What a peer quotes for one settlement method.
message SnapshotMethod {
  // Its tag: a truncated hash of its scheme's ID, four bytes.
  bytes tag = 1;
  // The scheme the node runs whose ID has that tag, for example
  // "hub-xrpl-testnet-xrp"; empty when it runs none.
  string scheme = 2;
  // The least the peer gives, in its virtual unit, for a unit of the
  // method's ledger that comes in (bid), and the most it asks for a unit
  // that goes out (ask), each the word of the snapshot's 32-bit float: a
  // mantissa m in its low 24 bits and an exponent e in its top 8, worth
  // m * 2^(e - 150). 0 closes the side.
  uint32 bid = 3;
  uint32 ask = 4;
  // For each drop of the grid, the most that can come in on the method
  // with its last unit still given at least the bid less the drop, and the
  // most that can go out with its last unit still asked at most the ask
  // over one less the drop, in the units of the method's ledger: eight
  // each, never decreasing, all 0 on a closed side.
  repeated uint64 bid_ladder = 5;
  repeated uint64 ask_ladder = 6;
}

// Settlement with one node, both ways
// (spec/areas/settlement.md#settlement-channels): kept from the first peering
// on, so a settlement arrives exactly once even after the peering ended.
message SettlementChannel {
  string node = 1;
  // The highest settlement applied from the node.
  uint64 settled_in = 2;
  // The last settlement this node sent.
  uint64 settled_out = 3;
  // Whether that one is still on its way, unacknowledged.
  bool sending = 4;
  // Its amount, in the scheme ledger's units, if so.
  uint64 sending_amount = 5;
  // Its tries that failed so far.
  uint32 sending_attempts = 6;
}

message ListSettlementChannelsRequest {}

message ListSettlementChannelsResponse {
  // By node ID.
  repeated SettlementChannel channels = 1;
}
