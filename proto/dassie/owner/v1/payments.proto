syntax = "proto3";

package dassie.owner.v1;

// Open Payments (spec/decisions/open-payments.md): the node's wallet
// addresses, one per active ledger, their incoming and outgoing payments, and
// the grants the owner decides. FAILED_PRECONDITION until the node has a
// hostname, which every URL names.

// A wallet address.
message WalletAddress {
  // Its URL, as other wallets and clients use it: https://host/pay/<slug>,
  // or https://host/.well-known/pay for the default ledger.
  string url = 1;
  // The same as a payment pointer: $host, or $host/pay/<slug>.
  string payment_pointer = 2;
  string ledger = 3;
  string asset_code = 4;
  uint32 asset_scale = 5;
  // Whether $host names it. The default ledger's address is also at
  // https://host/pay/<slug>; this is the one listed.
  bool is_default = 6;
}

message ListWalletAddressesRequest {}

message ListWalletAddressesResponse {
  // By ledger.
  repeated WalletAddress wallet_addresses = 1;
}

// Chooses the ledger $host names. NOT_FOUND unless it is active.
message SetDefaultLedgerRequest {
  // Empty to go back to the lowest active ledger.
  string ledger = 1;
}

message SetDefaultLedgerResponse {
  repeated WalletAddress wallet_addresses = 1;
}

// An incoming payment.
message IncomingPayment {
  // A UUID.
  string id = 1;
  // Its URL.
  string url = 2;
  // The wallet address it was created at.
  string wallet_address = 3;
  string ledger = 4;
  string asset_code = 5;
  uint32 asset_scale = 6;
  // The most it accepts; none for no limit.
  optional uint64 incoming_amount = 7;
  uint64 received_amount = 8;
  // The wallet address or key of the client that created it; empty for
  // the owner.
  string client = 9;
  // Its metadata, as JSON; empty for none.
  string metadata_json = 10;
  int64 created_at_unix_ms = 11;
  int64 expires_at_unix_ms = 12;
  // When it was completed: it received all it asked for, or its creator
  // said so.
  optional int64 completed_at_unix_ms = 13;
  // Its STREAM credentials: the ILP address to pay, and the 32-byte
  // shared secret.
  string destination_account = 14;
  bytes shared_secret = 15;
}

// Creates an incoming payment, as the owner: to ask for a payment, or to
// pay the node from a STREAM client. RESOURCE_EXHAUSTED when too many are
// open.
message CreateIncomingPaymentRequest {
  // Empty for the default ledger.
  string ledger = 1;
  // The most it accepts; none for no limit.
  optional uint64 incoming_amount = 2;
  // When it stops accepting money; 0 for a day from now. At most 30 days.
  int64 expires_at_unix_ms = 3;
  // Goes into its metadata as "description"; at most 256 bytes.
  string description = 4;
  // On a periphery node, the node ID of the uplink to be paid through: its
  // credentials name the address beneath that uplink. None for the one the
  // node picks. INVALID_ARGUMENT unless a node ID; FAILED_PRECONDITION on a
  // core node, or unless it is an uplink confirmed now.
  optional string uplink = 5;
}

message CreateIncomingPaymentResponse {
  IncomingPayment payment = 1;
}

// Completes an incoming payment: it takes no more money. NOT_FOUND for an
// unknown one, FAILED_PRECONDITION for an expired one.
message CompleteIncomingPaymentRequest {
  string id = 1;
}

message CompleteIncomingPaymentResponse {
  IncomingPayment payment = 1;
}

message ListIncomingPaymentsRequest {
  // How many, newest first, up to 1000; 0 means 100.
  uint32 limit = 1;
}

message ListIncomingPaymentsResponse {
  // Newest first.
  repeated IncomingPayment payments = 1;
}

// Streaming: the newest incoming payments, then each change.
message SubscribeIncomingPaymentsRequest {
  // How many it follows, newest first, up to 1000; 0 means 100.
  uint32 limit = 1;
}

message IncomingPaymentEvent {
  // Set on the first item.
  bool reset = 1;
  // Payments added or changed, whole.
  repeated IncomingPayment upserted = 2;
  // IDs of payments no longer among the newest.
  repeated string removed = 3;
}

// An amount in an asset: what a limit or a payment names. Its asset may
// differ from the ledger's for what a receiver gets.
message OpenPaymentsAmount {
  uint64 value = 1;
  string asset_code = 2;
  uint32 asset_scale = 3;
}

// An outgoing payment: a client's, with the owner's consent (M6b), or the
// owner's own (M6c).
message OutgoingPayment {
  // A UUID.
  string id = 1;
  // Its URL.
  string url = 2;
  // The wallet address that pays.
  string wallet_address = 3;
  string ledger = 4;
  string asset_code = 5;
  uint32 asset_scale = 6;
  // The incoming payment it pays, or the ILP address it pays when the
  // owner paid STREAM credentials.
  string receiver = 7;
  // What it debits at most, in the ledger's units.
  uint64 debit_amount = 8;
  // What the receiver is to get, in its asset.
  OpenPaymentsAmount receive_amount = 9;
  // What it debited so far.
  uint64 sent_amount = 10;
  // "sending", "completed" or "failed".
  string state = 11;
  // Why it failed, for people.
  string failure = 12;
  // The wallet address of the client that created it; empty for the
  // owner.
  string client = 13;
  // The quote it pays; empty if made without one.
  string quote_url = 14;
  // Its metadata, as JSON; empty for none.
  string metadata_json = 15;
  int64 created_at_unix_ms = 16;
  // When it completed or failed.
  optional int64 finished_at_unix_ms = 17;
  // The wallet address it pays, when the owner named one (M6c): as a URL,
  // and as a payment pointer. Empty when only the incoming payment is
  // known.
  string recipient_url = 18;
  string recipient_pointer = 19;
}

message ListOutgoingPaymentsRequest {
  // How many, newest first, up to 1000; 0 means 100.
  uint32 limit = 1;
}

message ListOutgoingPaymentsResponse {
  // Newest first.
  repeated OutgoingPayment payments = 1;
}

// Streaming: the newest outgoing payments, then each change.
message SubscribeOutgoingPaymentsRequest {
  // How many it follows, newest first, up to 1000; 0 means 100.
  uint32 limit = 1;
}

message OutgoingPaymentEvent {
  // Set on the first item.
  bool reset = 1;
  // Payments added or changed, whole.
  repeated OutgoingPayment upserted = 2;
  // IDs of payments no longer among the newest.
  repeated string removed = 3;
}

// The owner's Send: to a payment pointer, a wallet address URL, a payment
// request (an incoming payment's URL), or STREAM credentials, on this node
// or another.

// Whom a payment goes to.
message Recipient {
  // The wallet address it pays, as a URL and as a payment pointer.
  string wallet_address = 1;
  string payment_pointer = 2;
  // Its name, as its wallet says; empty for none.
  string public_name = 3;
  // The asset it is paid in.
  string asset_code = 4;
  uint32 asset_scale = 5;
  // Whether it is one of this node's own wallet addresses.
  bool is_own = 6;
  // The payment request it names, if it named one.
  optional PaymentRequest request = 7;
}

// An incoming payment that waits to be paid.
message PaymentRequest {
  // Its URL.
  string url = 1;
  // What it still accepts; none for any amount.
  optional uint64 remaining = 2;
  optional int64 expires_at_unix_ms = 3;
  // Its description, if its metadata has one.
  string description = 4;
}

// Reads what the input names. INVALID_ARGUMENT for input that names no
// recipient or one that cannot be paid; UNAVAILABLE when its wallet does
// not answer.
message ResolveRecipientRequest {
  // A payment pointer ($host[/path]), a wallet address URL, or an
  // incoming payment's URL.
  string recipient = 1;
}

message ResolveRecipientResponse {
  Recipient recipient = 1;
}

// STREAM credentials, as CreateIncomingPayment returns them here or on
// another node: a payment to them pays the receiver at them, without an
// incoming payment's URL to read.
message StreamCredentials {
  // The ILP address to pay.
  string destination_account = 1;
  // The 32-byte shared secret.
  bytes shared_secret = 2;
  // The asset the receiver is paid in, as its incoming payment says; an
  // empty code and a scale of 0 when unknown. Needed for a receive amount.
  // The receiver must say the same, if it says one.
  string asset_code = 3;
  uint32 asset_scale = 4;
}

// Quotes a payment. For a wallet address it creates the incoming payment
// there first; a payment request, or STREAM credentials, are paid as they
// are. A probe measures the rate of the route, in any asset: what the
// recipient gets is what the debit buys at that rate, which is the least
// the payment then delivers per unit sent.
message QuoteSendRequest {
  // As ResolveRecipientRequest; empty when credentials are given.
  string recipient = 1;
  // Instead of a recipient: STREAM credentials to pay. Takes a debit
  // amount, or a receive amount when they name the asset; no note.
  optional StreamCredentials credentials = 6;
  // The ledger to pay from: the one the route to the recipient starts on,
  // since the node's own endpoints never convert. Empty for that one;
  // another is refused.
  string ledger = 2;
  // Needed for a wallet address; for a payment request, none means what
  // it still accepts.
  oneof amount {
    // What the recipient is to get, in its asset.
    uint64 receive_amount = 3;
    // What to send, in the ledger's asset; the recipient gets what it
    // buys at the quote's rate.
    uint64 debit_amount = 5;
  }
  // For the recipient, at most 256 characters: the description of the
  // incoming payment created. Not for payment requests.
  string note = 4;
}

// A quote for the owner: payable once, until it expires.
message SendQuote {
  // A UUID.
  string id = 1;
  string ledger = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  // What it debits, in the ledger's units.
  uint64 debit_amount = 5;
  // What the recipient gets, in its asset.
  OpenPaymentsAmount receive_amount = 6;
  // The incoming payment it pays, or the ILP address it pays when it pays
  // STREAM credentials.
  string receiver = 7;
  int64 expires_at_unix_ms = 8;
  // Absent when it pays STREAM credentials.
  Recipient recipient = 9;
}

message QuoteSendResponse {
  SendQuote quote = 1;
}

// Pays a quote of the owner's. INVALID_ARGUMENT once it has expired or was
// paid; FAILED_PRECONDITION when the funds do not cover it.
message SendPaymentRequest {
  string quote_id = 1;
}

message SendPaymentResponse {
  OutgoingPayment payment = 1;
}

// Streaming: one outgoing payment, whole, each time it changes. NOT_FOUND
// for no such payment.
message SubscribeOutgoingPaymentRequest {
  string id = 1;
}

// What a grant's access item allows, as the owner reads it.
message GrantAccess {
  // "incoming-payment", "outgoing-payment" or "quote".
  string type = 1;
  // "create", "read", "read-all", "list", "list-all", "complete".
  repeated string actions = 2;
  // The wallet address it reaches, and its ledger; empty for any of the
  // node's.
  string wallet_address = 3;
  string ledger = 4;
  // Its limits, for outgoing payments.
  optional GrantLimits limits = 5;
}

// The limits of an outgoing-payment grant, and what it spent.
message GrantLimits {
  // The only incoming payment it may pay; empty for any.
  string receiver = 1;
  // The ISO 8601 repeating interval the amounts apply to; empty for all
  // time.
  string interval = 2;
  // The most it may debit, and deliver, per interval.
  optional OpenPaymentsAmount debit_amount = 3;
  optional OpenPaymentsAmount receive_amount = 4;
  // The interval's window now, if now is in one.
  optional int64 window_start_unix_ms = 5;
  optional int64 window_end_unix_ms = 6;
  // What it spent in that window: debited, and delivered.
  uint64 spent_debit = 7;
  uint64 spent_receive = 8;
  // When the interval's first window starts and its last one ends; each
  // absent for a side that is open, and both without an interval.
  optional int64 starts_at_unix_ms = 9;
  optional int64 ends_at_unix_ms = 10;
  // The receiver as read while the owner is asked: only on a pending
  // grant's limits that name one.
  optional GrantReceiver receiver_payment = 11;
}

// The incoming payment a grant may only pay, as it was read.
message GrantReceiver {
  // Its asset: what it receives is in it.
  string asset_code = 1;
  uint32 asset_scale = 2;
  // What it still accepts; absent for no set amount.
  optional uint64 remaining = 3;
  // When it stops accepting money.
  optional int64 expires_at_unix_ms = 4;
  // Whether it accepts no more money: completed, or expired.
  bool closed = 5;
  // Why it could not be read; empty if it was, and then the rest is unset.
  string error = 6;
  // Whether the grant's receive limit is in another asset than this
  // receiver is paid in, so no payment to it fits the limit. False when
  // it could not be read.
  bool limit_in_other_asset = 7;
}

// A grant the owner decides, or decided.
message Grant {
  // A UUID.
  string id = 1;
  // The client's wallet address.
  string client = 2;
  // Its public name, if its wallet address has one; else empty.
  string client_name = 3;
  repeated GrantAccess access = 4;
  // The wallet address the client asks the owner to prove, if any.
  string subject = 5;
  // "pending" or "approved".
  string state = 6;
  int64 created_at_unix_ms = 7;
  optional int64 decided_at_unix_ms = 8;
  // When a pending one lapses.
  int64 expires_at_unix_ms = 9;
}

// The grant waiting for the owner at the consent page: its ID and key come
// from the URL the client sent the owner to. NOT_FOUND once decided,
// lapsed or with a wrong key.
message GetGrantRequestRequest {
  string id = 1;
  string key = 2;
}

message GetGrantRequestResponse {
  Grant grant = 1;
}

// The owner approves or denies a waiting grant. NOT_FOUND as for
// GetGrantRequest.
message DecideGrantRequest {
  string id = 1;
  string key = 2;
  bool approve = 3;
}

message DecideGrantResponse {
  // Where to send the owner back to the client; empty if it named nowhere.
  string finish_url = 1;
}

// The grants the owner approved and has not revoked.
message ListGrantsRequest {}

message ListGrantsResponse {
  // Newest first.
  repeated Grant grants = 1;
}

// Streaming: the approved grants, whole, each time they change.
message SubscribeGrantsRequest {}

// Revokes a grant and its tokens. NOT_FOUND for an unknown one.
message RevokeGrantRequest {
  string id = 1;
}

message RevokeGrantResponse {}
