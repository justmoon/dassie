syntax = "proto3";

package dassie.owner.v1;

import "dassie/owner/v1/hub_founding.proto";
import "dassie/owner/v1/tls.proto";

message GetBasicStateRequest {}

// What anyone who can reach the node may know about it. It decides which
// screen the wallet shows.
message GetBasicStateResponse {
  NodeState state = 1;
  // Empty while uninitialized.
  string node_id = 2;
  // Empty until configured.
  string hostname = 3;
  // "test" or "g": the first segment of the node's ILP address.
  string ilp_allocation_scheme = 4;
  string version = 5;
  // The active settlement schemes, for example "stub".
  repeated string active_settlement_schemes = 6;
}

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  // No node key yet: setup is open to whoever holds the setup token.
  NODE_STATE_UNINITIALIZED = 1;
  // Set up, and this connection has no session.
  NODE_STATE_ANONYMOUS = 2;
  // Set up, and this connection belongs to the owner.
  NODE_STATE_AUTHENTICATED = 3;
}

message GetStatusRequest {}

message GetStatusResponse {
  string version = 1;
  Runtime runtime = 2;
  int64 started_at_unix_ms = 3;
  // The certificate the HTTPS listener serves.
  Certificate certificate = 4;
  AcmeStatus acme = 5;
  // The ports the node listens on, which may differ from the configured
  // ones under systemd. The HTTP port is 0 for a node without an HTTP
  // listener, as the desktop app's.
  uint32 http_port = 6;
  uint32 https_port = 7;
  // Whether the node runs as a periphery node
  // (spec/areas/network.md#periphery-nodes): it has a QUIC endpoint and no
  // hostname, so it registers nowhere, and its peers are its uplinks.
  bool periphery = 8;
  // The relay the node chose (spec/areas/node.md#a-chosen-relay); unset if
  // none.
  ChosenRelay relay = 9;
  // The origins it answers Open Payments under, the main one first
  // (spec/areas/payments.md#the-nodes-names): its hostname's, or else its
  // name at the default front door, the names its owner added, and the
  // names it holds there. Empty before setup on a node without a hostname.
  repeated string open_payments_origins = 10;
  // The node's UDP endpoint for its snapshot
  // (spec/areas/rate-feed.md#what-the-owner-sees); unset on a node without
  // its socket, which answers no request.
  RateFeed feed = 11;
  // The settlement hubs the node validates
  // (spec/areas/hubs.md#the-validator-in-the-node), by hub ID; empty on a
  // node that validates none, which is every node whose owner did not turn
  // validating on.
  repeated HubValidator validating = 12;
  // The settlement hubs the node founds as their sponsor
  // (spec/areas/hubs.md#founding-a-hub), the oldest first.
  repeated HubFounding founding = 13;
  // What the connector counted since the engine started
  // (spec/areas/node.md#the-dassie-command); unset while the engine is
  // down.
  PacketCounters packets = 14;
  // What the peer protocol counted since the engine started; unset while
  // the engine is down.
  PeerCounters peer_protocol = 15;
}

// The connector's counters: what came of the Prepares it took. Read in one
// step of the engine, so they agree with each other; each only grows while
// the engine runs, and starts again at zero when it restarts.
message PacketCounters {
  // Prepares taken.
  uint64 prepares = 1;
  // Prepares forwarded.
  uint64 forwarded = 2;
  // Prepares answered at once: ILDCP, or a reject.
  uint64 answered = 3;
  // Forwarded packets fulfilled.
  uint64 fulfilled = 4;
  // Forwarded packets rejected downstream.
  uint64 rejected = 5;
  // Forwarded packets that expired, or whose next hop went away.
  uint64 expired = 6;
  // Fulfillments that did not match the condition.
  uint64 wrong_fulfillments = 7;
  // Responses for no packet in flight: late, duplicate or bogus.
  uint64 unexpected_responses = 8;
  // Prepares that reused a request ID in flight.
  uint64 duplicates = 9;
}

// The peer protocol's counters, read as the connector's are.
message PeerCounters {
  // Requests sent.
  uint64 requests_sent = 1;
  // Requests that failed or got an error.
  uint64 requests_failed = 2;
  // Requests dropped because too many were in flight.
  uint64 requests_dropped = 3;
  // Inbound requests refused, by any status.
  uint64 inbound_refused = 4;
  // Link states accepted.
  uint64 link_states_accepted = 5;
  // Link states dropped as old, unknown, invalid or too frequent.
  uint64 link_states_dropped = 6;
  // Peerings begun.
  uint64 peerings = 7;
  // Peerings ended.
  uint64 terminations = 8;
  // ILP responses given up on: refused, out of time, or no room to retry.
  uint64 answers_dropped = 9;
  // Settlement messages the peer acknowledged.
  uint64 settlements_delivered = 10;
  // Settlement messages applied from peers.
  uint64 settlements_applied = 11;
  // Settlement messages that arrived again and were not applied twice.
  uint64 settlements_duplicate = 12;
  // Settlement requests sent.
  uint64 settlements_requested = 13;
  // Settlement channels closed.
  uint64 channels_closed = 14;
  // As a registrar of names: commitments logged, and those that lapsed
  // unsealed.
  uint64 commitments_logged = 15;
  uint64 commitments_lapsed = 16;
  // As a registrar: names granted, renewed, freed after their grace period,
  // and released for a split.
  uint64 names_granted = 17;
  uint64 names_renewed = 18;
  uint64 names_freed = 19;
  uint64 names_released = 20;
  // Registrations of the node's own names started, and abandoned short of
  // a receipt.
  uint64 registrations_started = 21;
  uint64 registrations_abandoned = 22;
  // Renewals of the node's own names sent.
  uint64 renewals_sent = 23;
}

// How the node's validator of one settlement hub stands.
message HubValidator {
  // The hub's ID, as hex.
  string hub = 1;
  // Its index in the set of validators in force; `validators` when the
  // node is no longer in it.
  uint32 index = 2;
  // How many validators the set in force has.
  uint32 validators = 3;
  // The height of the last final block it executed.
  uint64 height = 4;
  // That block's timestamp.
  int64 final_unix_ms = 5;
  // The view its consensus is in.
  uint64 view = 6;
  HubPhase phase = 7;
  // Whether it declared the hub stalled: it then never votes in it again,
  // and signs the payout set of its last final block.
  bool stalled = 8;
  // Whether a quorum of validators checked the hub's escrow, so that its
  // deposits are credited.
  bool escrow_checked = 9;
  // Whether it follows the escrow on its XRPL server now.
  bool xrpl_connected = 10;
  // The version of the hub protocol the hub runs
  // (spec/decisions/hub-protocol-version.md).
  uint32 protocol_version = 11;
  // A newer version a quorum of validators voted to move the hub to, and
  // when it runs it; 0 and unset while no move waits.
  uint32 upgrade_version = 12;
  int64 upgrade_unix_ms = 13;
}

// Where a settlement hub is in its life
// (spec/designs/settlement-hubs.md#9-shutdown).
enum HubPhase {
  HUB_PHASE_UNSPECIFIED = 0;
  // Taking every operation.
  HUB_PHASE_RUNNING = 1;
  // After a shutdown: payees may still redeem and claim.
  HUB_PHASE_SHUTTING_DOWN = 2;
  // Its last block is final; its payout set pays everyone out.
  HUB_PHASE_ENDED = 3;
}

// What the node's UDP endpoint for its snapshot does
// (spec/areas/rate-feed.md#what-the-owner-sees): whether it answers, where,
// and its counters since the node started. The counters are read one by
// one, without a lock, so they may be a datagram apart from each other;
// each only grows.
message RateFeed {
  // Whether the endpoint answers requests now: the node has a snapshot, so
  // it is a core node whose owner lets it offer swaps, and its engine runs.
  // A periphery node, one without a hostname yet, or one that offers no
  // swaps holds the socket and answers nothing.
  bool serving = 1;
  // Where the socket takes datagrams, for example "0.0.0.0:7768"; empty if
  // it cannot be read.
  string address = 2;
  // Snapshots the socket refused to send.
  uint64 send_failed = 6;
  // Datagrams taken.
  uint64 received = 8;
  // Datagrams that got no answer and cost no budget: no request, a broken
  // one, one from an address an answer cannot go to, or any while the node
  // had no snapshot.
  uint64 ignored = 14;
  // Requests answered with the snapshot.
  uint64 answered = 16;
  // Requests not answered because the budget on answers per second was
  // spent.
  uint64 over_budget = 17;
}

message ChosenRelay {
  string node = 1;
  string url = 2;
  // How the node stands with the relay now.
  RelayConnection connection = 4;
}

// How a node stands with the relay it chose
// (spec/areas/node.md#a-chosen-relay).
enum RelayConnection {
  RELAY_CONNECTION_UNSPECIFIED = 0;
  // The node holds its connection to the relay.
  RELAY_CONNECTION_CONNECTED = 1;
  // The node dials the relay, or waits to dial it again, and has not failed
  // for long enough for that to be a fault: right after it starts, or after
  // a brief drop.
  RELAY_CONNECTION_CONNECTING = 2;
  // The node has failed to reach the relay for so long that the wait before
  // each dial has reached its cap (`RelayLink` in quic/relay.rs), or the
  // relay is the node itself.
  RELAY_CONNECTION_UNREACHABLE = 3;
}

enum Runtime {
  RUNTIME_UNSPECIFIED = 0;
  // The node bound its own sockets.
  RUNTIME_STANDALONE = 1;
  // systemd passed the sockets in.
  RUNTIME_SYSTEMD = 2;
}

message AcmeStatus {
  // Whether an ACME account is stored, so the node can renew by itself.
  bool has_account = 1;
  // When the node next checks whether to renew; 0 if it never will.
  int64 next_check_unix_ms = 2;
  // Why the last attempt failed; empty if it did not.
  string last_error = 3;
}
