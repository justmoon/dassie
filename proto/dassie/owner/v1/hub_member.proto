syntax = "proto3";

package dassie.owner.v1;

import "dassie/owner/v1/ledger.proto";

// The node's account in each settlement hub it is in, one per asset, and
// moving the owner's funds between it and the owner book of the hub's
// asset on the node's XRP Ledger testnet account: XRP for the XRP hub,
// DSUSD for the DSUSD hub (spec/areas/hubs.md#in-the-node). The contract has no services: these
// methods are numbered in `Request` and `Response` (transport.proto) with
// the rest: GetHubStatus, HubDeposit, HubWithdraw, SetHubAutomatic and
// HubGiveUp.
//
// Each method but GetHubStatus acts on one hub, which its request names by
// `hub_id`: the hub's ID as 64 hex digits, as `HubStatus.hub_id` gives it,
// or empty while the node is in one hub only. Each fails with
// FAILED_PRECONDITION while no settlement hub scheme runs, NOT_FOUND for a
// hub the node is not in, and INVALID_ARGUMENT for a `hub_id` that is not
// 64 hex digits, or empty while the node is in several hubs.
//
// Amounts are in the hub ledger's smallest unit, as `Ledger` amounts are:
// XRP and dollars at scale 9. A move pays whole units of the hub asset's
// smallest, drops of XRP or millionths of a token; what is less is left.

// A hold of ours toward a peer, or a peer's toward us.
message HubHold {
  // The peer's node ID, if the node peers with it over the hub.
  string peer = 1;
  // The other side's account in the hub.
  uint32 account = 2;
  // What is left in it.
  uint64 amount = 3;
}

// A move between the hub and the owner book of its asset, on the node's XRP
// Ledger account, on its way. It is done
// once the hub account's counters show it, and failed only once the side it
// leaves says its payment moved nothing: until then no other move is made,
// and it is never paid again.
message HubMove {
  Direction direction = 1;
  uint64 amount = 2;
  // Whether the owner asked for it, rather than the node.
  bool by_owner = 3;
  // When it was made.
  int64 sent_at_unix_ms = 4;
  // When the XRP Ledger applied a deposit, which the hub has not credited
  // yet.
  optional int64 applied_at_unix_ms = 5;
  // On its way for long, since it was applied or made: the hub may not be
  // crediting or executing it. The node waits, and pays nothing again.
  bool late = 6;

  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    // From the owner book into the hub.
    DIRECTION_DEPOSIT = 1;
    // From the hub to the owner book.
    DIRECTION_WITHDRAW = 2;
  }
}

message HubStatus {
  // The hub's ID, the digest of its rules, as 64 hex digits.
  string hub_id = 1;
  // The node's account in the hub, once the hub has said it.
  optional uint32 account = 2;
  // How the account stands with the hub: UNFUNDED until the first deposit
  // opens it.
  LedgerConnection connection = 3;
  // What the account can spend, as the validators last agreed.
  uint64 balance = 4;
  // Its account reserve: never spendable.
  uint64 reserve = 5;
  // Everything deposits credited it.
  uint64 deposited = 6;
  // Everything its withdrawals took, ledger fees included.
  uint64 withdrawn = 7;
  // Our holds toward peers.
  repeated HubHold paying = 8;
  // Peers' holds toward us.
  repeated HubHold taking = 9;
  // Below the floor the node deposits, above the ceiling it withdraws,
  // each time back to the midpoint.
  uint64 floor = 10;
  uint64 ceiling = 11;
  // Whether the node moves funds by itself.
  bool automatic = 12;
  // Until when the owner's last move pauses the automatic ones, if it
  // still does.
  optional int64 paused_until_unix_ms = 13;
  // The move on its way, if any: one at a time.
  HubMove moving = 14;
  // How many validators the hub has, and how many answered up to the block
  // the account has read to.
  uint32 validators = 15;
  uint32 validators_answering = 16;
  // The move the owner gave up, which way and how much, while it holds the
  // node's own moves back: the other side may yet show it, and then books
  // it, once. Cleared when the owner turns the node's own moves on again or
  // moves funds.
  HubMove given_up = 17;
  // What withdrawals the escrow could not pay brought back: the owner's
  // deposits too, counted apart.
  uint64 returned = 18;
  // The settlement scheme over the hub, which names its ledger and asset,
  // such as `hub-xrpl-testnet-xrp`.
  string scheme = 19;
  // While the issuer of a token hub's asset freezes the hub: the stamp of
  // the hub's block from which it is frozen, as the validators last said.
  // Meanwhile the hub's method is unavailable: no packet goes over it, and
  // nothing moves into or out of it; what waits goes after the thaw, and
  // claims the hub still pays go. Never for an XRP hub.
  optional int64 frozen_since_unix_ms = 20;
  // Whether the issuer holds the hub's escrow: a freeze of its line or of
  // the token, or a transfer fee. While it does, the escrow pays out
  // nothing, and a hub that ended pays out only once the issuer lets go.
  bool escrow_held = 21;
}

// Every hub the node is in whose scheme runs, in the order of their
// schemes; none while none runs.
message GetHubStatusRequest {}

message GetHubStatusResponse {
  repeated HubStatus hubs = 1;
}

// Deposits from the owner book of the hub's asset into the hub, opening the
// account if the hub has none for the node yet. Pauses the hub's automatic
// moves for a while. RESOURCE_EXHAUSTED while a move of the hub is on its
// way; INVALID_ARGUMENT for less than the hub asset's smallest unit, or
// less than opening the account takes; FAILED_PRECONDITION before the hub
// said whether the account exists, while the hub is unavailable (frozen,
// or its scheme not in step with it), while the owner book does not run
// synced, or for more than the owner's funds there with the fee.
message HubDepositRequest {
  uint64 amount = 1;
  // The hub, by its ID as HubStatus.hub_id gives it; empty while the node
  // is in one hub only. NOT_FOUND for a hub the node is not in,
  // INVALID_ARGUMENT for none while it is in several.
  string hub_id = 2;
}

message HubDepositResponse {
  HubStatus status = 1;
}

// Withdraws from the hub to the owner book of its asset, on the node's XRP
// Ledger account. Pauses the hub's
// automatic moves for a while. RESOURCE_EXHAUSTED while a move of the hub is
// on its way, or while the node checks, or tops up, a token hub's escrow's
// XRP; INVALID_ARGUMENT for less than the hub pays out; FAILED_PRECONDITION
// without an account in the hub, while the hub is unavailable, or for more
// than it can spend with the fees.
message HubWithdrawRequest {
  uint64 amount = 1;
  // The hub, as in HubDepositRequest.
  string hub_id = 2;
}

message HubWithdrawResponse {
  HubStatus status = 1;
}

// Turns the node's own moves to and from the hub on or off. The node keeps
// the choice, per hub.
message SetHubAutomaticRequest {
  bool automatic = 1;
  // The hub, as in HubDepositRequest.
  string hub_id = 2;
}

message SetHubAutomaticResponse {
  HubStatus status = 1;
}

// Gives up the hub's move on its way, once it is late: the node forgets it
// and books nothing. Its own moves of the hub then wait until the owner turns
// them on again or moves funds. FAILED_PRECONDITION when no move is on its way, or it is
// not late.
message HubGiveUpRequest {
  // The hub, as in HubDepositRequest.
  string hub_id = 1;
}

message HubGiveUpResponse {
  HubStatus status = 1;
}
