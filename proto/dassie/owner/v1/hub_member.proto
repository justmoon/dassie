syntax = "proto3";

package dassie.owner.v1;

import "dassie/owner/v1/ledger.proto";

// The node's account in each settlement hub it is in, one per asset, and
// moving the owner's funds between it and the owner book of the hub's
// asset on the node's XRP Ledger account on the hub's network: XRP for an
// XRP hub, the token for a token hub, DSUSD on the testnet and RLUSD on
// mainnet (spec/areas/hubs.md#in-the-node). The contract has no services:
// these methods are numbered in `Request` and `Response`
// (transport.proto) with the rest: GetHubStatus, HubDeposit, HubWithdraw,
// SetHubAutomatic, HubGiveUp and SubscribeHubEvents.
//
// Each method but GetHubStatus and SubscribeHubEvents acts on one hub, which its request names by
// `scheme`, the settlement scheme over it, as `HubStatus.scheme` gives it:
// the node is in one hub per scheme, and a scheme names its hub for as
// long as the node runs it, while a hub's ID changes when it is founded
// anew. It is required: each fails with INVALID_ARGUMENT for none, or for
// one that is not a settlement hub scheme, and NOT_FOUND for a hub scheme
// the node does not run.
//
// Amounts are in the hub ledger's smallest unit, as `Ledger` amounts are:
// XRP and dollars at scale 9. A move pays whole units of the hub asset's
// smallest, drops of XRP or millionths of a token; what is less is left.

// A hold of ours toward a peer, or a peer's toward us.
message HubHold {
  // The peer's node ID, if the node peers with it over the hub.
  string peer = 1;
  // The other side's account in the hub.
  uint32 account = 2;
  // What is left in it.
  uint64 amount = 3;
}

// A move between the hub and the owner book of its asset, on the node's XRP
// Ledger account, on its way. It is done
// once the hub account's counters show it, and failed only once the side it
// leaves says its payment moved nothing: until then no other move is made,
// and it is never paid again.
message HubMove {
  Direction direction = 1;
  uint64 amount = 2;
  // Whether the owner asked for it, rather than the node.
  bool by_owner = 3;
  // When it was made.
  int64 sent_at_unix_ms = 4;
  // When the XRP Ledger applied a deposit, which the hub has not credited
  // yet.
  optional int64 applied_at_unix_ms = 5;
  // On its way for long, since it was applied or made: the hub may not be
  // crediting or executing it. The node waits, and pays nothing again.
  bool late = 6;

  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    // From the owner book into the hub.
    DIRECTION_DEPOSIT = 1;
    // From the hub to the owner book.
    DIRECTION_WITHDRAW = 2;
  }
}

message HubStatus {
  // The hub's ID, the digest of its rules, as 64 hex digits: to tell which
  // hub this is, never to name it in a request, which `scheme` does.
  string hub_id = 1;
  // The node's account in the hub, once the hub has said it.
  optional uint32 account = 2;
  // How the account stands with the hub: UNFUNDED until the first deposit
  // opens it.
  LedgerConnection connection = 3;
  // What the account can spend, as the validators last agreed.
  uint64 balance = 4;
  // Its account reserve: never spendable.
  uint64 reserve = 5;
  // Everything deposits credited it.
  uint64 deposited = 6;
  // Everything its withdrawals took, ledger fees included.
  uint64 withdrawn = 7;
  // Our holds toward peers.
  repeated HubHold paying = 8;
  // Peers' holds toward us.
  repeated HubHold taking = 9;
  // Below the floor the node deposits, above the ceiling it withdraws to
  // the owner's own account, each time back to the midpoint.
  uint64 floor = 10;
  uint64 ceiling = 11;
  // Whether the node moves funds by itself.
  bool automatic = 12;
  // Until when the owner's last move pauses the automatic ones, if it
  // still does.
  optional int64 paused_until_unix_ms = 13;
  // The move on its way, if any: one at a time.
  HubMove moving = 14;
  // How many validators the hub has, and how many answered up to the block
  // the account has read to.
  uint32 validators = 15;
  uint32 validators_answering = 16;
  // The move the owner gave up, which way and how much, while it holds the
  // node's own moves back: the other side may yet show it, and then books
  // it, once. Cleared when the owner turns the node's own moves on again or
  // moves funds.
  HubMove given_up = 17;
  // What withdrawals the escrow could not pay brought back: the owner's
  // deposits too, counted apart.
  uint64 returned = 18;
  // The settlement scheme over the hub, which names its ledger and asset,
  // such as `hub-xrpl-testnet-xrp`, or `hub-xrpl-rlusd` on mainnet: what
  // the methods that act on the hub name it by.
  string scheme = 19;
  // While the issuer of a token hub's asset freezes the hub: the stamp of
  // the hub's block from which it is frozen, as the validators last said.
  // Meanwhile the hub's method is unavailable: no packet goes over it, and
  // nothing moves into or out of it; what waits goes after the thaw, and
  // claims the hub still pays go. Never for an XRP hub.
  optional int64 frozen_since_unix_ms = 20;
  // Whether the issuer holds the hub's escrow: a freeze of its line or of
  // the token, or a transfer fee. While it does, the escrow pays out
  // nothing, and a hub that ended pays out only once the issuer lets go.
  bool escrow_held = 21;
}

// Every hub the node is in whose scheme runs, in the order of their
// schemes; none while none runs.
message GetHubStatusRequest {}

message GetHubStatusResponse {
  repeated HubStatus hubs = 1;
}

// Deposits from the owner book of the hub's asset into the hub, opening the
// account if the hub has none for the node yet. Pauses the hub's automatic
// moves for a while. RESOURCE_EXHAUSTED while a move of the hub is on its
// way; INVALID_ARGUMENT for less than the hub asset's smallest unit, or
// less than opening the account takes; FAILED_PRECONDITION before the hub
// said whether the account exists, while the hub is unavailable (frozen,
// or its scheme not in step with it), while the owner book does not run
// synced, or for more than the owner's funds there with the fee.
message HubDepositRequest {
  uint64 amount = 1;
  // The hub, by the settlement scheme over it, as HubStatus.scheme gives
  // it, such as `hub-xrpl-testnet-xrp`.
  string scheme = 3;
}

message HubDepositResponse {
  HubStatus status = 1;
}

// Withdraws from the hub to the owner book of its asset, on the node's XRP
// Ledger account. Pauses the hub's
// automatic moves for a while. RESOURCE_EXHAUSTED while a move of the hub is
// on its way, or while the node checks, or tops up, a token hub's escrow's
// XRP; INVALID_ARGUMENT for less than the hub pays out; FAILED_PRECONDITION
// without an account in the hub, while the hub is unavailable, or for more
// than it can spend with the fees.
message HubWithdrawRequest {
  uint64 amount = 1;
  // The hub, by its scheme, as in HubDepositRequest.
  string scheme = 3;
}

message HubWithdrawResponse {
  HubStatus status = 1;
}

// Turns the node's own moves to and from the hub on or off. The node keeps
// the choice, per hub.
message SetHubAutomaticRequest {
  bool automatic = 1;
  // The hub, by its scheme, as in HubDepositRequest.
  string scheme = 3;
}

message SetHubAutomaticResponse {
  HubStatus status = 1;
}

// Gives up the hub's move on its way, once it is late: the node forgets it
// and books nothing. Its own moves of the hub then wait until the owner turns
// them on again or moves funds. FAILED_PRECONDITION when no move is on its way, or it is
// not late.
message HubGiveUpRequest {
  // The hub, by its scheme, as in HubDepositRequest.
  string scheme = 2;
}

message HubGiveUpResponse {
  HubStatus status = 1;
}

// Streams what the node sees of each settlement hub it is in, as it sees
// it, for debugging and for watching a network: what its account in the hub
// read, in the order it read it, the commitments and claims of its packets
// over the hub, and its own moves between the owner book and the hub. An
// event stream (spec/areas/rpc.md#live-streams): nothing is replayed, the
// node makes the events only while someone listens, and a subscriber that
// falls behind is told how many it missed by `lagged`. RESOURCE_EXHAUSTED
// when too many are subscribed.
//
// Unlike the rest of this file, amounts here are the hub's own, at six
// decimals: drops of XRP, or millionths of a token.
message SubscribeHubEventsRequest {}

message HubEvent {
  // The hub, by the settlement scheme over it, as `HubStatus.scheme` gives
  // it; empty for `lagged`.
  string scheme = 1;
  // When the node saw it, by its own clock.
  int64 observed_at_unix_ms = 2;
  oneof event {
    // This many events were dropped because the subscriber fell behind.
    // The first item, and one at least every minute, has 0: the stream is
    // live.
    uint64 lagged = 3;
    // A final block, up to which the account read everything that touched
    // it.
    HubBlock block = 4;
    // An operation that touched the account, in a final block.
    HubOperation operation = 5;
    // The account as of a block through which it read everything.
    HubAccountState account = 6;
    // The hub has no account for the node's key.
    HubUnfunded unfunded = 7;
    // A hold's reduction took effect: `amount` went back to its payer.
    HubHoldReduced reduced = 8;
    // What claims took and waited in a hold was paid to its payee.
    HubClaimsPaid claims_paid = 9;
    // The validators no longer keep what touched the account since it
    // last read, so it read its holds anew as of a block.
    HubResynced resynced = 10;
    // An operation of ours the hub refused for good.
    HubDropped dropped = 11;
    // A packet's commitment: ours as the payer, signed with our Prepare, or
    // a peer's as the payee, accepted with its Prepare.
    HubCommitment commitment = 12;
    // A claim in the reply to a Fulfill: ours as the payer, sent, or a
    // peer's as the payee, taken.
    HubClaim claim = 13;
    // A move of the node's between the owner book and the hub.
    HubMoveEvent move = 14;
  }
}

message HubBlock {
  uint64 height = 1;
  // Its timestamp, by the hub's clock.
  int64 timestamp_unix_ms = 2;
}

message HubOperation {
  // The block it was in.
  uint64 height = 1;
  int64 timestamp_unix_ms = 2;
  // What it is, as the hub's log names it, such as "hold-open",
  // "hold-fund", "hold-reduce", "hold-release", "claim", "redeem", "pay",
  // "transfer", "withdraw", "close", "set-disbursal" or "dispute".
  string kind = 3;
  // The account that signed it, and the sequence it used.
  uint32 signer = 4;
  uint64 sequence = 5;
  // The hold it acts on or opened; 0 if none.
  uint64 hold = 6;
  // The other account it pays, opened or closes to; 0 if none.
  uint32 peer_account = 7;
  // What it moves: the amount it names; T for a redeem; what the
  // commitments of a claim add up to; 0 for the rest.
  uint64 amount = 8;
  // "applied", "failed" (it paid its fee and used its sequence) or
  // "refused" (it paid nothing).
  string outcome = 9;
  // Why it failed or was refused, such as "Funds"; empty if applied.
  string reason = 10;
  uint64 fee = 11;
  // Why we submitted it, if it is ours, such as "settle:<ID>",
  // "redeem:<hold>", "claim:<hold>", "dispute:<hold>", "disbursal" or
  // "withdraw"; empty if it is not.
  string purpose = 12;
}

message HubAccountState {
  // The block it is as of.
  uint64 height = 1;
  // The account's number; 0 until the node knows it.
  uint32 number = 2;
  uint64 balance = 3;
  uint64 reserve = 4;
  // The sequence its next operation carries.
  uint64 sequence = 5;
  // Everything deposits credited it, and withdrawals that came back.
  uint64 deposited = 6;
  // Everything its withdrawals took, ledger fees included.
  uint64 withdrawn = 7;
  // What withdrawals that came back credited it.
  uint64 returned = 8;
  bool closing = 9;
}

message HubUnfunded {}

message HubHoldReduced {
  uint64 hold = 1;
  uint64 amount = 2;
}

message HubClaimsPaid {
  uint64 hold = 1;
  // How many commitments' sequences it paid above the last redeemed W, and
  // the first and last of them.
  uint32 count = 2;
  uint64 first_sequence = 3;
  uint64 last_sequence = 4;
  // Whether it paid what waited unlisted, having read the hold anew.
  bool unlisted = 5;
}

message HubResynced {
  uint64 height = 1;
  int64 timestamp_unix_ms = 2;
  // How many holds it mirrored before.
  uint32 holds_before = 3;
  // The purpose of the operation of ours that used its sequence in between,
  // whose fate is not known yet, as in `HubOperation.purpose`; empty if
  // none.
  string unread = 4;
}

message HubDropped {
  // As in `HubOperation.purpose`.
  string purpose = 1;
}

// Which side of a packet over a hub the node is on.
enum HubRole {
  HUB_ROLE_UNSPECIFIED = 0;
  // It pays: it signs commitments and claims.
  HUB_ROLE_PAYER = 1;
  // It is paid: it takes them.
  HUB_ROLE_PAYEE = 2;
}

message HubCommitment {
  HubRole role = 1;
  // The peer's node ID.
  string peer = 2;
  uint64 hold = 3;
  uint64 sequence = 4;
  // The packet's amount in the hub's unit, rounded up.
  uint64 amount = 5;
  // The Prepare's execution condition, as `Packet.condition` has it: the
  // same on every hop.
  bytes condition = 6;
  // The Prepare's expiry less the hub's margin.
  int64 expiry_unix_ms = 7;
}

message HubClaim {
  HubRole role = 1;
  // The peer's node ID.
  string peer = 2;
  uint64 hold = 3;
  // T: everything owed on the hold so far.
  uint64 total = 4;
  // W: the commitment sequence up to which T covers every fulfilled
  // packet.
  uint64 through = 5;
}

message HubMoveEvent {
  Stage stage = 1;
  HubMove.Direction direction = 2;
  uint64 amount = 3;
  // Its payment's ID with the scheme of the side it leaves: the owner
  // book's for a deposit, the hub scheme's for a withdrawal.
  string payment = 4;
  // Whether the owner asked for it, rather than the node.
  bool by_owner = 5;

  enum Stage {
    STAGE_UNSPECIFIED = 0;
    // Its payment went out.
    STAGE_STARTED = 1;
    // The hub account's counters show it.
    STAGE_DONE = 2;
    // The side it leaves says its payment moved nothing.
    STAGE_FAILED = 3;
    // On its way for long; the node waits, and pays nothing again.
    STAGE_LATE = 4;
    // The owner gave it up.
    STAGE_GIVEN_UP = 5;
  }
}
