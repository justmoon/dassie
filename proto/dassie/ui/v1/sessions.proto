syntax = "proto3";

package dassie.ui.v1;

message Session {
  // Names the session in RevokeSession. It is not the cookie and cannot be
  // turned into one.
  string id = 1;
  int64 created_at_unix_ms = 2;
  // Updated at most once an hour.
  int64 last_used_at_unix_ms = 3;
  int64 expires_at_unix_ms = 4;
  // As the browser sent it at login, cut to 256 bytes.
  string user_agent = 5;
  // Whether this is the session making the call.
  bool current = 6;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  // Most recently used first.
  repeated Session sessions = 1;
}

// NOT_FOUND if there is no such session.
message RevokeSessionRequest {
  string id = 1;
}

message RevokeSessionResponse {}

message RevokeAllSessionsRequest {
  // Keep the session making the call, so its user stays logged in.
  bool keep_current = 1;
}

message RevokeAllSessionsResponse {
  uint32 revoked = 1;
}
