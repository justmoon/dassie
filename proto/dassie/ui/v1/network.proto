syntax = "proto3";

package dassie.ui.v1;

// A node in the node table (spec/areas/network.md#node-table): what its link
// state says, and why it is in the table.
message NetworkNode {
  string id = 1;
  // Empty until its link state is known.
  string url = 2;
  string alias = 3;
  // Its link state's sequence, a timestamp in ms; 0 if unknown.
  uint64 sequence = 4;
  // Why the node is in the table. A node with no reason left is removed
  // after a grace period.
  bool is_self = 5;
  bool bootstrap = 6;
  // On a majority of the bootstrap nodes' lists.
  bool majority = 7;
  // Registered with this node, as a bootstrap node.
  bool registered = 8;
  bool peer = 9;
  // When its registration with this node lapses; 0 if not registered.
  int64 registered_until_unix_ms = 10;
  // Its first hops, if a route reaches it.
  repeated string first_hops = 11;
  // The neighbors its link state lists, by ID.
  repeated string neighbors = 12;
  // The settlement schemes its link state lists.
  repeated string settlement_schemes = 13;
  // How many hops away it is: 0 for this node; unset when no route
  // reaches it.
  optional uint32 distance = 14;
  PeerState peer_state = 15;
  bool banned = 16;
  // The peering, while there is one.
  NetworkPeer peering = 17;
  reserved 18;
  reserved "ban";
}

enum PeerState {
  PEER_STATE_UNSPECIFIED = 0;
  PEER_STATE_NONE = 1;
  // This node asked, and waits for the answer.
  PEER_STATE_REQUESTING = 2;
  PEER_STATE_PEERED = 3;
  PEER_STATE_TERMINATING = 4;
}

// Streams the node table: first all of it (`reset`), then the nodes that
// changed and those that left.
message SubscribeNodesRequest {}

message NodeTableEvent {
  bool reset = 1;
  // Nodes added or changed, whole.
  repeated NetworkNode upserted = 2;
  // IDs of nodes that left the table.
  repeated string removed = 3;
}

message ListNodesRequest {}

message ListNodesResponse {
  // By ID; without their neighbors, settlement schemes and peering, which
  // could pass the message limit: SubscribeNodes has them.
  repeated NetworkNode nodes = 1;
}

// A peering.
message NetworkPeer {
  string node = 1;
  // The settlement scheme, for example "stub".
  string scheme = 2;
  // The scheme's version both speak.
  uint32 version = 3;
  // The credit the peer extends to this node is not its to know
  // (spec/decisions/own-fulfills.md).
  reserved 4;
  reserved "credit_in";
  // The credit this node extends to the peer, in the scheme ledger's
  // units.
  uint64 credit_out = 5;
  int64 since_unix_ms = 6;
  // The last authenticated message from the peer.
  int64 last_seen_unix_ms = 7;
  // Whether the peer asked.
  bool inbound = 8;
  // "peered", or "terminating" while it is being ended
  // (spec/decisions/peering-lifecycle.md).
  string state = 9;
  // Why it is being ended, if it is: "owner", "unresponsive", "not-peered",
  // "short-of-room"
  // or "unspecified".
  string termination_reason = 10;
  // Whether this node lists the peer as a neighbor in its link state, so
  // others route through it: it is confirmed, and not held down.
  bool advertised = 11;
  // What this node owes the peer net, in the scheme ledger's units:
  // negative when the peer owes this node.
  int64 owed = 12;
  reserved 13, 14;
  reserved "refused_24h", "cost";
  // Whether the peer was heard from within the last 60 s. An offline peer
  // is not advertised, so no route goes through it; the peering stays
  // until it has been silent for a day (spec/decisions/peering-lifecycle.md).
  bool online = 15;
}

message ListPeersRequest {}

message ListPeersResponse {
  // By node ID.
  repeated NetworkPeer peers = 1;
}

// A route: the ILP address prefix of a node, and the peers that lead to it
// on shortest paths.
message NetworkRoute {
  string node = 1;
  // For example "test.das.dNKbw…".
  string prefix = 2;
  repeated string first_hops = 3;
  // How many hops away the node is.
  uint32 distance = 4;
}

// A route to one of this node's own endpoints.
message LocalRoute {
  // The endpoint's address.
  string prefix = 1;
  // For example "btp:3" or "local:0".
  string endpoint = 2;
  // Its ledger, for example "stub+usd".
  string ledger = 3;
}

message ListRoutesRequest {}

message ListRoutesResponse {
  // By node ID.
  repeated NetworkRoute routes = 1;
  // By prefix.
  repeated LocalRoute local_routes = 2;
}

// Streams the routes, whole, each time they change.
message SubscribeRoutesRequest {}

// This node's standing with one bootstrap node
// (spec/decisions/membership-economics.md).
message BootstrapStatus {
  string node = 1;
  // Whether its list, as last fetched, names this node.
  bool listed = 2;
  // When it last took this node's registration; 0 if not since start.
  int64 registered_at_unix_ms = 3;
  // When its list was last fetched; 0 if never.
  int64 list_fetched_unix_ms = 4;
}

message GetRegistrationStatusRequest {}

message GetRegistrationStatusResponse {
  // This node's ID.
  string node = 1;
  // One per configured bootstrap node.
  repeated BootstrapStatus bootstrap = 2;
  // Whether this node is on a majority of their lists: a member of the
  // network others peer with.
  bool member = 3;
}

// Streams the registration status, whole, each time it changes.
message SubscribeRegistrationRequest {}

// Registers with a bootstrap node now, rather than when the node next
// would. NOT_FOUND if it is not a bootstrap node; FAILED_PRECONDITION
// before the node has a hostname, or while a registration with it is on
// its way.
message RegisterWithBootstrapRequest {
  string node = 1;
}

message RegisterWithBootstrapResponse {}

// Ends a peering, as its owner (spec/decisions/peering-lifecycle.md): the
// node first collects, privately, asking the peer to settle once more, then
// tells it; once the packets in flight are done it ends on both sides.
// Nothing else is settled for its end (spec/decisions/ending-a-peering.md):
// what is owed stays on the books. The pair does not peer again for a day.
message TerminatePeeringRequest {
  string node = 1;
}

message TerminatePeeringResponse {}

// Bans a node: it is never asked to peer, is refused when it asks, and a
// peering with it is ended.
message BanNodeRequest {
  string node = 1;
}

message BanNodeResponse {}

message UnbanNodeRequest {
  string node = 1;
}

message UnbanNodeResponse {}

message ListBansRequest {}

message ListBansResponse {
  // By ID. Only the owner bans (spec/decisions/own-fulfills.md).
  repeated string nodes = 1;
  reserved 2;
  reserved "bans";
}

// The owner's settings for peers (spec/decisions/exchange-rates.md,
// spec/decisions/passive-rebalancing.md).
message PeerSettings {
  reserved 1;
  reserved "grace_share_ppm";
  // The fee on what passes from one peer to another, in parts per million
  // of what comes in, rounded down: 0 to 100 000 (10%).
  uint32 connector_fee_ppm = 2;
  // The spread on what such a packet converts, in parts per million of
  // what goes out: 0 to 100 000.
  uint32 fx_spread_ppm = 3;
  // k, how far the owner's inventory moves the rate such a packet converts
  // at from spot, in parts per million: 0 (spot) to 100 000. Always set in
  // answers; a SetPeerSettings without it keeps the node's.
  optional uint32 rebalance_ppm = 4;
}

message GetPeerSettingsRequest {}

message GetPeerSettingsResponse {
  PeerSettings settings = 1;
}

// INVALID_ARGUMENT when out of range.
message SetPeerSettingsRequest {
  PeerSettings settings = 1;
}

message SetPeerSettingsResponse {
  PeerSettings settings = 1;
}

// Settlement with one node, both ways
// (spec/areas/settlement.md#settlement-channels): kept from the first peering
// on, so a settlement arrives exactly once even after the peering ended.
message SettlementChannel {
  string node = 1;
  // The highest settlement applied from the node.
  uint64 settled_in = 2;
  // The last settlement this node sent.
  uint64 settled_out = 3;
  // Whether that one is still on its way, unacknowledged.
  bool sending = 4;
  // Its amount, in the scheme ledger's units, if so.
  uint64 sending_amount = 5;
  // Its tries that failed so far.
  uint32 sending_attempts = 6;
}

message ListSettlementChannelsRequest {}

message ListSettlementChannelsResponse {
  // By node ID.
  repeated SettlementChannel channels = 1;
}
