syntax = "proto3";

package dassie.ui.v1;

// NamesService: the names the owner registers for the node, held for its
// ID by the bootstrap nodes as registrars (spec/areas/network.md#names).
// Its methods are numbered in `Request` and `Response` (transport.proto):
// RegisterName, RenewName and SubscribeNames. Each needs the engine.

// Registers a name for the node at every registrar: committed sealed, and
// unsealed once every registrar has logged the commitment. The name is the
// node's once the registrars' windows close, unless a commitment logged
// earlier wins it, and once their lists reach the node.
// INVALID_ARGUMENT if the name is not 3 to 32 lowercase letters, digits and
// hyphens, as a DNS label, or is reserved. FAILED_PRECONDITION if the node
// holds it, the registrars' lists show it taken, the node has no bootstrap
// nodes, or a registration of it is under way. RESOURCE_EXHAUSTED while too
// many registrations are under way.
message RegisterNameRequest {
  string name = 1;
}

message RegisterNameResponse {}

// Renews a name the node holds at every registrar now. The node renews its
// names by itself before they expire; a registrar renews a name only once
// its expiry is near, and otherwise answers with the expiry it has.
// NOT_FOUND if the node does not hold the name.
message RenewNameRequest {
  string name = 1;
}

message RenewNameResponse {}

// Streams the owner's names, whole, each time they change.
message SubscribeNamesRequest {}

message NamesStatus {
  // The registrars, by node ID: the node's bootstrap nodes.
  repeated string registrars = 1;
  // Whether the node's view of who holds each name is frozen: too few of
  // the registrars' lists are fresh to take it anew, so it keeps what it
  // had.
  bool frozen = 2;
  // The names the node registers, and those it holds.
  repeated OwnName names = 3;
  // This node's ID.
  string node = 4;
}

// A name the node registers or holds.
message OwnName {
  string name = 1;
  NameState state = 2;
  // The node a quorum of the registrars' lists name for it, in this node's
  // view; empty if none.
  string holder = 3;
  // When it expires, by the registrars' clocks; 0 if unknown. The node
  // renews it before.
  int64 expires_at_unix_ms = 4;
  // While it is committed: until when every registrar must have logged the
  // commitment for the node to unseal it. 0 otherwise.
  int64 unseal_by_unix_ms = 5;
  // One per registrar.
  repeated NameAtRegistrar registrars = 6;
}

enum NameState {
  NAME_STATE_UNSPECIFIED = 0;
  // Committing at every registrar.
  NAME_STATE_COMMITTING = 1;
  // Every registrar logged the commitment: unsealing at each.
  NAME_STATE_UNSEALING = 2;
  // Unsealed: waiting for the registrars to grant it, and for their lists.
  NAME_STATE_WAITING = 3;
  // The node holds it.
  NAME_STATE_HELD = 4;
  // Another node holds it.
  NAME_STATE_LOST = 5;
  // The registrars' lists name this node and another for it: neither
  // holds it until the registrars release it.
  NAME_STATE_SPLIT = 6;
  // Not granted: nobody holds it, long after its registration.
  NAME_STATE_NOT_HELD = 7;
  // Not every registrar logged the commitment in time: no registrar
  // learned the name.
  NAME_STATE_ABANDONED = 8;
  // The node held it, and too few lists name it now: it is renewed while
  // the registrars keep it for the node in their grace periods.
  NAME_STATE_LAPSING = 9;
}

// How a name stands with one registrar.
message NameAtRegistrar {
  string registrar = 1;
  // Whether it logged the node's commitment.
  bool receipt = 2;
  // Whether it took the node's unsealing.
  bool unsealed = 3;
  // The status it last refused a request of the node's with: 409 for one
  // it does not take, 429 while it takes too many, 503 while it is full; 0
  // if none.
  uint32 refused_status = 4;
  // The node its list names for the name, as last fetched; empty if none.
  string listed_holder = 5;
  // When the name expires there, by its clock; 0 if it lists none.
  int64 listed_expires_at_unix_ms = 6;
  // Whether its list is fresh enough to count.
  bool list_fresh = 7;
}
