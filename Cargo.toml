[workspace]
members = [
  "crates/dassie-cli",
  "crates/dassie-connector",
  "crates/dassie-identity",
  "crates/dassie-ilp",
  "crates/dassie-ledger",
  "crates/dassie-node",
  "crates/dassie-node-core",
  "crates/dassie-oer",
  "crates/dassie-payments",
  "crates/dassie-peer",
  "crates/dassie-release",
  "crates/dassie-settlement",
  "crates/dassie-stream",
  "crates/dassie-xrpl",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

# Integer overflow is a bug wherever it happens, and in this code base it
# usually means a wrong balance. Checks stay on in every profile (D16).
[profile.dev]
overflow-checks = true

# Crypto, property tests and simulations are unbearably slow unoptimized.
# Line tables keep file:line in backtraces.
[profile.test]
opt-level = 3
debug = "line-tables-only"
overflow-checks = true

[profile.release]
lto = true
codegen-units = 1
overflow-checks = true

# The WASM modules (built as wasm32 cdylibs by scripts/build-wasm.ts): small
# rather than fast, since every browser downloads them.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true

# The binary the end-to-end tests run (tests/e2e): debug-fast to build, with
# the same checks as release.
[profile.e2e]
inherits = "dev"

# The Nix checks (flake.nix): the test profile's settings, so that CI builds
# as a local `cargo test` does, under a name that does not put `cargo check`
# and clippy in test mode, which would lint only cfg(test) code.
[profile.ci]
inherits = "test"

# The binaries the install tests run in containers (nix/release.nix): the
# release profile's code, without the link time of fat LTO.
[profile.install-test]
inherits = "release"
lto = false
codegen-units = 16
