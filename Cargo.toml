[workspace]
members = [
  "crates/dassie-base64url",
  "crates/dassie-cli",
  "crates/dassie-connector",
  "crates/dassie-desktop",
  "crates/dassie-feed",
  "crates/dassie-hub",
  "crates/dassie-identity",
  "crates/dassie-kit",
  "crates/dassie-ilp",
  "crates/dassie-ledger",
  "crates/dassie-node",
  "crates/dassie-node-core",
  "crates/dassie-oer",
  "crates/dassie-payments",
  "crates/dassie-peer",
  "crates/dassie-release",
  "crates/dassie-settlement",
  "crates/dassie-sim",
  "crates/dassie-stream",
  "crates/dassie-wallet-assets",
  "crates/dassie-wasm",
  "crates/dassie-xrpl",
]
resolver = "3"

# Every crate is released together under this one version, which names the
# release (spec/areas/release.md#versions).
[workspace.package]
version = "0.2.9"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

# The simple shape of spec/decisions/tigerstyle.md, in every crate and every
# target, so that a new crate cannot forget it: no unsafe code, no panicking
# index or unwrap, no lossy integer cast, no floating point, and functions of
# at most 70 lines (clippy.toml). Tests opt out where a panic is the failed
# test.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
float_arithmetic = "deny"
too_many_lines = "deny"
panic = "deny"
unreachable = "deny"

# Integer overflow is a bug wherever it happens, and in this code base it
# usually means a wrong balance. Checks stay on in every profile
# (spec/decisions/tigerstyle.md).
[profile.dev]
overflow-checks = true

# The node's SLH-DSA key takes most of a second to generate unoptimized,
# which every debug node, the end-to-end tests' and the dev network's,
# does at its start (spec/decisions/post-quantum-node-id.md). Its code is
# `slh-dsa`'s generics, compiled where dassie-identity instantiates them,
# so that crate is optimized too; nix/rust/default.nix does the same.
[profile.dev.package.dassie-identity]
opt-level = 3

[profile.dev.package.slh-dsa]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Crypto, property tests and simulations are unbearably slow unoptimized.
# Line tables keep file:line in backtraces.
[profile.test]
opt-level = 3
debug = "line-tables-only"
overflow-checks = true

[profile.release]
lto = true
codegen-units = 1
overflow-checks = true

# The WASM modules (built as wasm32 cdylibs by scripts/build-wasm.ts): small
# rather than fast, since every browser downloads them.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true

# The binary the end-to-end tests run (tests/e2e): debug-fast to build, with
# the same checks as release.
[profile.e2e]
inherits = "dev"

# The flake's crane builds (flake.nix): the test profile's settings, under
# a name that does not put `cargo check` and clippy in test mode, which
# would lint only cfg(test) code. nix/rust builds the crates with the same
# checks on (spec/decisions/crate-by-crate-builds.md).
[profile.ci]
inherits = "test"

# The simulation runner, dassie-sim
# (spec/decisions/random-seed-simulations.md): the test profile's code, so
# that a campaign's run checks every invariant before every commit, as tests
# do, and `dassie-sim run` replays a seed exactly as the campaign ran it.
[profile.sim]
inherits = "test"

# The binaries the install tests run in containers (nix/release.nix): the
# release profile's code, without the link time of fat LTO.
[profile.install-test]
inherits = "release"
lto = false
codegen-units = 16
