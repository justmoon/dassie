# The testnet proof server's xrpld configuration (README.md). It follows the
# network and keeps its recent history only; clients reach it through Caddy,
# which forwards to the public ports on 127.0.0.1.

[server]
port_peer
port_rpc_admin_local
port_ws_admin_local
port_rpc_public
port_ws_public

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_ws_admin_local]
port = 6005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = ws
send_queue_limit = 500

# The public ports, behind Caddy. secure_gateway makes xrpld charge each
# request to the client address Caddy forwards, not to Caddy's own, so that
# one client's load slows down that client alone. Caddy sets that address
# itself and strips X-User, which would lift the limits.
[port_rpc_public]
port = 5006
ip = 127.0.0.1
protocol = http
secure_gateway = 127.0.0.1

[port_ws_public]
port = 6006
ip = 127.0.0.1
protocol = ws
secure_gateway = 127.0.0.1
send_queue_limit = 500

[network_id]
testnet

# The testnet's own hubs, since the default ones are mainnet's. Kept
# connected too (ips_fixed): a server whose peers are all strangers is
# easier to hold out of sync, which on the testnet ends in a wipe.
[ips]
s.altnet.rippletest.net 51235

[ips_fixed]
s.altnet.rippletest.net 51235

# Sized for a cold start, not for the steady state. After a restart,
# xrpld walks the whole state tree of the ledger it acquires, about 19M
# nodes on the testnet, and needs them in its tree cache until the walk
# completes. On small (524k nodes for 60 s) and large (4M for 120 s) the
# nodes leave the cache before it completes, so it never does and xrpld
# never syncs. huge keeps 8M for 900 s (rippled's kSizedItems), and a
# cold walk takes about 25 minutes. It holds about 13 GB of memory once in sync (README.md#memory).
[node_size]
huge

# About two days of ledgers. xrpld deletes older ones once it holds about
# twice as many, so it always has at least this much history: Dassie's
# history bound (spec/designs/xrpl-validation.md#6-the-account-on-proofs).
[ledger_history]
45000

# Threads that read the node store for that walk, 4 by default, whose
# queue then stood at hundreds of reads.
[prefetch_workers]
16

[node_db]
type = NuDB
path = /var/lib/xrpld/db/nudb
online_delete = 45000
advisory_delete = 0

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/log/xrpld/debug.log

[sntp_servers]
metadata.google.internal
time.google.com

[validators_file]
validators.txt

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
1

# xrpld's OpenSSL is linked in, and does not find the system's certificates
# by itself, which it needs to fetch the validator lists from their sites.
[ssl_verify_file]
/etc/ssl/certs/ca-certificates.crt
