name: CI

# Every push to `main`, and every pull request, whatever branch it targets,
# so that stacked PRs run too.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the run before it. Pushes to `main` each
# run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rust in the Nix sandbox: fmt, clippy (native and wasm32), tests and the
  # WASM bindings, with the toolchain pinned by the flake. The checks build
  # on the Vorstand Nix cloud (builds.vorstand.app, project dassie), which
  # keeps what it built: dependencies that have not changed are not built
  # again. The runner only sends the commit and follows the log.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # `checks` is every check for x86_64-linux: what `nix flake check`
      # builds on an x86_64 runner. The release binaries and the install
      # tests run in the release workflow, for a tag v<version> only. The
      # status, last, fails the step unless the build succeeded, so a log
      # stream cut short cannot pass for a green build.
      - name: Build the checks on the Nix cloud
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$NIX_CLOUD_TOKEN" ]; then
            echo "::error::No NIX_CLOUD_TOKEN: the Nix cloud builds nothing without it"
            exit 1
          fi
          api=https://nix.vorstand.app/v1/builds
          auth="Authorization: Bearer $NIX_CLOUD_TOKEN"
          body=$(jq -n --arg c "$COMMIT" '{commit: $c, attrs: ["checks"]}')
          job=$(curl -fsS -H "$auth" --json "$body" "$api" | jq -r .id)
          if [ -z "$job" ] || [ "$job" = null ]; then
            echo "::error::The Nix cloud started no build"
            exit 1
          fi
          curl -fsSN -H "$auth" "$api/$job/log"
          curl -fsS -H "$auth" "$api/$job" | jq -r '.outputs[][]'

  ts:
    runs-on: ubuntu-latest
    # A hung end-to-end test would otherwise hold the run for six hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      # The dependencies build:wasm and build:e2e compile, kept between runs
      # of the same branch or PR.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ts-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: ts-cargo-${{ runner.os }}-
      # pnpm's store, which the lockfile's packages are installed from, kept
      # between runs; after a change to the lockfile, the last one's.
      - name: pnpm store
        id: pnpm
        run: echo "store=$(nix develop --command pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # The TypeScript side needs npm and JSR, so it runs outside the
      # sandbox, in the flake's shell. pnpm installs the lockfile's packages
      # and checks it against the registries (the release-age rule). Then:
      # the WASM and wallet builds, the end-to-end binary, fmt, lint, type
      # check, the WASM vector tests, interop with ilp-protocol-stream, the
      # browser test, a fresh install through dassie init and the wallet
      # with Pebble as the ACME CA, and ilp-plugin-btp paying the node's
      # STREAM receiver (GitHub's CI=true makes the end-to-end tests fail
      # rather than skip).
      - name: TypeScript checks
        run: nix develop --command sh -c 'pnpm install --frozen-lockfile && node --run ci'
