name: CI

# Every push to `main`, and every pull request, whatever branch it targets,
# so that stacked PRs run too.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The actions are pinned to commits, not tags that can be moved: the `nix`
# job holds the Nix cloud's token, and the cloud builds what releases are
# made from.

# A new push to a PR supersedes the run before it. Pushes to `main` each
# run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything but the lockfile's check, in the Nix sandbox: for Rust, fmt,
  # clippy (native and wasm32), tests and the WASM bindings, with the
  # toolchain pinned by the flake; for TypeScript, what `node --run ci`
  # runs (nix/ts.nix). The checks build
  # on the Vorstand Nix cloud (builds.vorstand.app, project dassie), which
  # keeps what it built: dependencies that have not changed are not built
  # again. The runner only sends the commit and follows the log.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # `checks` is every check for x86_64-linux: what `nix flake check`
      # builds on an x86_64 runner. The release binaries and the install
      # tests run in the release workflow, for a tag v<version> only.
      - name: Build the checks on the Nix cloud
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/nix-cloud-build.sh build "$COMMIT" checks
      # A run that a newer push superseded stops its build too.
      - name: Cancel the build on the Nix cloud
        if: cancelled()
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
        run: scripts/nix-cloud-build.sh cancel

  # The lockfile against the registries: every package it pins must be as
  # old as pnpm-workspace.yaml's release-age rule asks. This needs the
  # registries' metadata, so it runs here rather than in the sandbox,
  # whose install trusts the lockfile (nix/pnpm.nix). With
  # --lockfile-only it reads the metadata and downloads no package. The
  # TypeScript side's checks themselves build in `nix` (nix/ts.nix).
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      # Node and pnpm from the flake's nixpkgs, not the whole dev shell.
      - name: Check the lockfile against the registries
        run: |
          nix shell --inputs-from . nixpkgs#nodejs_26 nixpkgs#pnpm_11 --command \
            pnpm install --frozen-lockfile --lockfile-only --config.update-notifier=false
