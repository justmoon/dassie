name: CI

# The rewrite lives on the `rewrite` branch until it replaces `main`.
# Milestones stack as `rewrite-*` branches, each PR into the one before it,
# so PRs into those run too.
on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite, "rewrite-*"]

permissions:
  contents: read

# A new push to a PR supersedes the run before it. Pushes to `rewrite` each
# run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything, as the flake's checks, in the Nix sandbox with the toolchain
  # and dependencies it pins: the Rust side (fmt, clippy native and wasm32,
  # tests, the WASM bindings) and the Deno side (nix/deno: fmt, lint, type
  # check, each member's tests, and each interop and end-to-end test file,
  # against the wallet and the end-to-end binary built in Nix). Each check is
  # its own job, built on nixbuild.net, which keeps what it built: checks
  # whose inputs have not changed are not run again.
  nix:
    uses: nixbuild/nixbuild-action/.github/workflows/ci-workflow.yml@v27
    secrets:
      nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
    with:
      # What `nix flake check` builds on an x86_64 runner.
      filter_builds: '.top_attr == "checks" and .system == "x86_64-linux"'
