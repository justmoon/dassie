name: CI

# The rewrite lives on the `rewrite` branch until it replaces `main`.
# Milestones stack as `rewrite-*` branches, each PR into the one before it,
# so PRs into those run too.
on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite, "rewrite-*"]

permissions:
  contents: read

# A new push to a PR supersedes the run before it. Pushes to `rewrite` each
# run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything, as the flake's checks, in the Nix sandbox with the toolchain
  # and dependencies it pins: the Rust side (fmt, clippy native and wasm32,
  # tests, the WASM bindings) and the Deno side (nix/deno: fmt, lint, type
  # check, each member's tests, and each interop and end-to-end test file,
  # against the wallet and the end-to-end binary built in Nix).
  #
  # One build of all checks, in nixbuild.net's store: it builds whatever is
  # stale, each derivation on its own machine and all at once, and keeps
  # what it built, so checks whose inputs have not changed are not run
  # again. Nothing is copied back to the runner.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          generate_summary_for: job
      # What `nix flake check` builds on an x86_64 runner. --keep-going
      # reports every failing check, not just the first.
      - name: Nix checks
        run: |
          names=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)
          mapfile -t checks < <(jq -r '.[] | ".#checks.x86_64-linux." + .' <<<"$names")
          nix build "${checks[@]}" \
            --print-build-logs --keep-going --no-link \
            --eval-store auto --store ssh-ng://nixbuild \
            --builders "" --max-jobs 2
