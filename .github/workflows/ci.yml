name: CI

# Every push to `main`, and every pull request, whatever branch it targets,
# so that stacked PRs run too.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The actions are pinned to commits, not tags that can be moved: the `nix`
# job holds the Nix cloud's token, and the cloud builds what releases are
# made from.

# A new push to a PR supersedes the run before it. Pushes to `main` each
# run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The flake's checks, in the Nix sandbox: for Rust, fmt, clippy (native
  # and wasm32), tests and the WASM bindings, with the toolchain pinned by
  # the flake; for TypeScript, what `node --run ci` runs (nix/ts.nix). The
  # checks build on the Vorstand Nix cloud (builds.vorstand.app, project
  # dassie), which keeps what it built: dependencies that have not changed
  # are not built again. The runner sends the commit and follows the log,
  # and checks the lockfile against the registries, which the sandbox
  # can't.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # `checks` is every check for x86_64-linux: what `nix flake check`
      # builds on an x86_64 runner. The release binaries and the install
      # tests run in the release workflow, for a tag v<version> only.
      - name: Build the checks on the Nix cloud
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/nix-cloud-build.sh build "$COMMIT" checks
      # The lockfile against the registries: every package it pins must be
      # as old as pnpm-workspace.yaml's release-age rule asks. This needs
      # the registries' metadata, so it runs on the runner rather than in
      # the sandbox, whose install trusts the lockfile (nix/pnpm.nix). With
      # --lockfile-only it reads the metadata and downloads no package.
      # Node and pnpm come from the flake's nixpkgs. It runs after a failed
      # build too, so that one run reports both.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        if: ${{ !cancelled() }}
      - name: Check the lockfile against the registries
        if: ${{ !cancelled() }}
        run: |
          nix shell --inputs-from . nixpkgs#nodejs_26 nixpkgs#pnpm_11 --command \
            pnpm install --frozen-lockfile --lockfile-only --ignore-scripts \
            --config.update-notifier=false
      # A run that a newer push superseded stops its build too.
      - name: Cancel the build on the Nix cloud
        if: cancelled()
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
        run: scripts/nix-cloud-build.sh cancel
