name: CI

# The rewrite lives on the `rewrite` branch until it replaces `main`.
# Milestones stack as `rewrite-*` branches, each PR into the one before it,
# so PRs into those run too.
on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite, "rewrite-*"]

permissions:
  contents: read

# A new push to a PR supersedes the run before it. Pushes to `rewrite` each
# run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rust in the Nix sandbox: fmt, clippy (native and wasm32), tests and the
  # WASM bindings, with the toolchain pinned by the flake. Each check is its
  # own job, built on nixbuild.net, which keeps what it built: dependencies
  # that have not changed are not built again.
  nix:
    uses: nixbuild/nixbuild-action/.github/workflows/ci-workflow.yml@v27
    secrets:
      nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
    with:
      # What `nix flake check` builds on an x86_64 runner. That includes the
      # release binaries for x64 and arm64 (static-binaries), so every PR
      # builds what a release would ship.
      filter_builds: '.top_attr == "checks" and .system == "x86_64-linux"'

  deno:
    runs-on: ubuntu-latest
    # A hung end-to-end test would otherwise hold the run for six hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      # The dependencies build:wasm and build:e2e compile, kept between runs
      # of the same branch or PR.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: deno-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: deno-cargo-${{ runner.os }}-
      # The Deno side needs npm and JSR, so it runs outside the sandbox, in
      # the flake's shell: the WASM and wallet builds, the end-to-end binary,
      # fmt, lint, type check, the WASM vector tests, interop with
      # ilp-protocol-stream, the browser test, a fresh install through
      # dassie init and the wallet with Pebble as the ACME CA, and
      # ilp-plugin-btp paying the node's STREAM receiver (GitHub's CI=true
      # makes the end-to-end tests fail rather than skip).
      - name: Deno checks
        run: nix develop --command deno task ci

  # The installer and the updater on each distribution
  # (tests/e2e/install_test.ts): privileged containers with systemd, and a
  # mirror of releases built on nixbuild.net with the test key. In the deno
  # job above, without a mirror, these tests are skipped.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu, fedora, centos]
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
      - name: Install tests
        env:
          DASSIE_INSTALL_DISTROS: ${{ matrix.distro }}
        run: |
          nix build .#install-test-mirror --out-link install-test-mirror --print-build-logs
          DASSIE_INSTALL_MIRROR="$PWD/install-test-mirror" \
            nix shell --inputs-from . nixpkgs#deno nixpkgs#mkcert --command \
            deno test --allow-all tests/e2e/install_test.ts
