name: Release

# Builds, checks, signs and publishes Dassie to the mirror,
# get.dassie.land (spec/decisions/release-integrity.md,
# spec/decisions/build-system.md): every tag v<version> as a release
# (meta/latest). The checks only a release needs run here, not in CI: the
# install tests on each distribution, the NixOS module in a VM, and the
# static release binaries. The original's releases were uploaded by hand,
# and nothing in its repository published the installer (UI-12).
#
# It runs in the `Release` environment. What it needs:
# - secrets.NIX_CLOUD_TOKEN: the builds run on the Vorstand Nix cloud
#   (builds.vorstand.app, project dassie), as CI's do, and the jobs fetch
#   what it built from the project's cache with the same token.
# - secrets.MINISIGN_SECRET_KEY: the release key file (`minisign -G`), and
#   secrets.MINISIGN_PASSWORD if it has one. Its public key is
#   resources/minisign.pub: what is signed must verify with it.
# - vars.GCP_WORKLOAD_IDENTITY_PROVIDER and vars.GCP_SERVICE_ACCOUNT: a
#   service account with roles/storage.objectUser on the bucket
#   (vars.MIRROR_BUCKET, by default get.dassie.land), through workload
#   identity federation.
# Keep the key and the GCP variables in the environment, not the
# repository: with deployment rules that admit only v* tags, no branch's
# workflow can read them. Limit who may push v* tags with a ruleset, and
# the workload identity provider to this repository.
#
# Without the key it builds and stops; without the bucket it signs, and the
# signed tree stays an artifact of the run.
#
# The actions are pinned to commits, and the cache's signing key to the one
# below: the release job holds the release key, and signs what the Nix
# cloud built.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One publish at a time, each to its end.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything the jobs below need, built once on the Vorstand Nix cloud:
  # the install tests' mirror; the tree of nix/release.nix; static-binaries,
  # which checks that the binaries are static and run, the arm64 one under
  # qemu; and dassie-release.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build on the Nix cloud
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          scripts/nix-cloud-build.sh build "$COMMIT" \
            packages.x86_64-linux.install-test-mirror \
            packages.x86_64-linux.release \
            packages.x86_64-linux.static-binaries \
            packages.x86_64-linux.release-tool
      - name: Cancel the build on the Nix cloud
        if: cancelled()
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
        run: scripts/nix-cloud-build.sh cancel

  # The installer and the updater on each distribution
  # (tests/e2e/install_test.ts): privileged containers with systemd, and a
  # mirror of releases built with the test key.
  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu, fedora, centos]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The Nix cloud's cache, which only its signing key may fill, and
      # which a project's token reads.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix.vorstand.app/cache/dassie
            extra-trusted-public-keys = nix-cloud-1:9HgKchsAo5NaX4Zbk7kxJ1r/U/4Zg4pqIif1c021AKE=
            netrc-file = /etc/nix/netrc
      - name: Nix cloud token
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
        run: printf 'machine nix.vorstand.app login nix password %s\n' "$NIX_CLOUD_TOKEN" | sudo tee /etc/nix/netrc > /dev/null
      # The mirror comes from the cache: with --max-jobs 0, a miss fails
      # rather than building on the runner. Node, pnpm and mkcert, not the
      # whole of the flake's shell, and of the workspace's packages those
      # tests/e2e imports.
      - name: Install tests
        env:
          DASSIE_INSTALL_DISTROS: ${{ matrix.distro }}
        run: |
          nix build .#install-test-mirror --out-link install-test-mirror --max-jobs 0
          DASSIE_INSTALL_MIRROR="$PWD/install-test-mirror" \
            nix shell --inputs-from . nixpkgs#nodejs_26 nixpkgs#pnpm_11 nixpkgs#mkcert --command \
            sh -c 'pnpm install --frozen-lockfile --filter @dassie/tests-e2e... && node --test tests/e2e/install_test.ts'

  # The flake's NixOS module, in a VM (nix/release.nix, nixos-test), with
  # the install tests' 1.0.0, which the build job made. The runner has KVM;
  # the VM test is built here, the rest comes from the cache.
  nixos:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix.vorstand.app/cache/dassie
            extra-trusted-public-keys = nix-cloud-1:9HgKchsAo5NaX4Zbk7kxJ1r/U/4Zg4pqIif1c021AKE=
            netrc-file = /etc/nix/netrc
            system-features = nixos-test benchmark big-parallel kvm
      - name: Nix cloud token
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
        run: printf 'machine nix.vorstand.app login nix password %s\n' "$NIX_CLOUD_TOKEN" | sudo tee /etc/nix/netrc > /dev/null
      - name: NixOS test
        run: nix build .#nixos-test -L

  release:
    needs: [install, nixos]
    runs-on: ubuntu-latest
    environment: Release
    timeout-minutes: 90
    permissions:
      contents: read
      # Workload identity: GitHub's OIDC token is what GCP trusts.
      id-token: write
    env:
      BUCKET: ${{ vars.MIRROR_BUCKET || 'get.dassie.land' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix.vorstand.app/cache/dassie
            extra-trusted-public-keys = nix-cloud-1:9HgKchsAo5NaX4Zbk7kxJ1r/U/4Zg4pqIif1c021AKE=
            netrc-file = /etc/nix/netrc
      - name: Nix cloud token
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
        run: printf 'machine nix.vorstand.app login nix password %s\n' "$NIX_CLOUD_TOKEN" | sudo tee /etc/nix/netrc > /dev/null

      # What the build job made, from the cache (--max-jobs 0: a miss fails
      # rather than building on the runner). The tree of nix/release.nix:
      # the bundles for x64 and arm64, the flake for NixOS, SHA256SUMS and
      # meta/latest; and dassie-release, which checks the tree as the
      # updater would.
      - name: Fetch
        run: |
          nix build .#release --out-link built --max-jobs 0
          nix build .#release-tool --out-link tool --max-jobs 0

      # scripts/release.ts checks every bundle against SHA256SUMS, signs it,
      # and verifies the signed tree with resources/minisign.pub. The tag
      # must name the version the tree was built as.
      - name: Sign
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::notice::No MINISIGN_SECRET_KEY: built, but neither signed nor published"
            exit 0
          fi
          if [ ! -f resources/minisign.pub ]; then
            echo "::error::resources/minisign.pub is missing: nothing would trust the signature"
            exit 1
          fi
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          unset MINISIGN_SECRET_KEY
          # scripts/release.ts imports node: modules only: nothing to install.
          nix shell --inputs-from . nixpkgs#nodejs_26 nixpkgs#minisign --command \
            node scripts/release.ts built signed --secret-key "$key" \
            --public-key resources/minisign.pub \
            --verifier tool/bin/dassie-release --version "${TAG#v}"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.sign.outputs.signed == 'true'
        with:
          name: mirror
          path: signed/
          retention-days: 14

      - id: gcp
        if: steps.sign.outputs.signed == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # A version's files are uploaded once and cached for good, the
      # signature last. A file already there must be the same bytes (a run
      # again signs the same build, fetched from the cache, and an Ed25519
      # signature is deterministic), so a run again completes what an
      # interrupted one left. Only once every file
      # is there does meta/latest name the version, uncached, and never
      # one older than what it names.
      - name: Publish
        if: steps.gcp.outcome == 'success'
        run: |
          set -euo pipefail
          version=$(cat signed/meta/latest)
          remote="gs://$BUCKET/$version"
          files=$(cd "signed/$version" && ls dassie-* flake.tar.gz)
          for file in $files SHA256SUMS SHA256SUMS.minisig; do
            if ! gcloud storage ls "$remote/$file" > /dev/null 2>&1; then
              gcloud storage cp --cache-control="public, max-age=31536000, immutable" \
                "signed/$version/$file" "$remote/$file"
            fi
            gcloud storage cp "$remote/$file" "$RUNNER_TEMP/published"
            if ! cmp -s "$RUNNER_TEMP/published" "signed/$version/$file"; then
              echo "::error::$version/$file is published with other bytes"
              exit 1
            fi
          done
          current=$(gcloud storage cat "gs://$BUCKET/meta/latest" 2> /dev/null || true)
          if [ -n "$current" ] && [ "$current" != "$version" ]; then
            newer=0
            tool/bin/dassie-release supersedes "$version" "$current" || newer=$?
            if [ "$newer" -eq 1 ]; then
              echo "::warning::meta/latest names $current, later than $version: left as it is"
              exit 0
            fi
          fi
          gcloud storage cp --cache-control="no-cache, max-age=0" \
            signed/meta/latest "gs://$BUCKET/meta/latest"
          # sh.dassie.land serves the installer.
          if [ -f signed/install.sh ]; then
            gcloud storage cp --cache-control="no-cache, max-age=0" \
              --content-type="text/plain; charset=utf-8" \
              signed/install.sh "gs://$BUCKET/install.sh"
          fi
          echo "::notice::Published dassie $version"
