name: Website

# Builds dassie.land from `main` and publishes it to its bucket, which the
# mirror's load balancer serves (spec/decisions/website-hosting.md,
# spec/areas/website.md). Pull requests get no preview: CI builds the site and
# serves it with its headers in the browser test.
#
# The publish job runs in the `Website` environment, which admits only
# `main`. What it needs there:
# - vars.GCP_WORKLOAD_IDENTITY_PROVIDER and vars.GCP_SERVICE_ACCOUNT: the
#   service account scripts/website/provision.sh makes, which may write
#   the bucket's objects and nothing else, through workload identity
#   federation;
# - vars.WEBSITE_BUCKET: that bucket.
# Without them it builds and stops.
#
# Then it checks the live site: headers.json's headers, the cache
# headers, the trailing-slash redirect and the WebAssembly's type. A
# backend bucket provisioned with other headers fails here.

on:
  push:
    branches: [main]
    # The site, the packages it imports, the crates its WASM modules are
    # built from, and what pins their builds: build_test.ts checks that
    # the list keeps up with them.
    paths:
      - apps/website/**
      - packages/wasm/**
      - packages/rpc/**
      - packages/ui/**
      - crates/dassie-identity/**
      - crates/dassie-ilp/**
      - crates/dassie-node-core/**
      - crates/dassie-oer/**
      - crates/dassie-stream/**
      - crates/dassie-wasm/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .npmrc
      - scripts/build-wasm.ts
      - scripts/website/**
      - resources/minisign.pub
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, each to its end; a newer push waits, and only the
# newest waiting one runs.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  # The build runs third-party code (pnpm's packages, the crates' build
  # scripts), so it holds no credential: the publish job takes what it
  # built.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: website-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: website-cargo-${{ runner.os }}-
      - name: pnpm store
        id: pnpm
        run: echo "store=$(nix develop --command pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # The flake's Node, pnpm and Rust, as in CI.
      - name: Build
        run: nix develop --command sh -c 'pnpm install --frozen-lockfile && node --run build:wasm && node --run build:website'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: apps/website/dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: Website
    timeout-minutes: 15
    permissions:
      contents: read
      # Workload identity: GitHub's OIDC token is what GCP trusts.
      id-token: write
    steps:
      # The repository's own scripts and headers.json; nothing is installed.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: site
      - id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Publish
        if: steps.gcp.outcome == 'success'
        env:
          BUCKET: ${{ vars.WEBSITE_BUCKET }}
        run: scripts/website/deploy.sh site "$BUCKET"
      - name: Check the live site
        if: steps.gcp.outcome == 'success'
        run: scripts/website/check.sh https://dassie.land/
      - if: steps.gcp.outcome != 'success'
        run: echo "::notice::Built, not published (no GCP_WORKLOAD_IDENTITY_PROVIDER in the Website environment)"
