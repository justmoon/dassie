name: Website

# Builds dassie.land from `main` on the Vorstand Nix cloud, as the flake's
# `website` package (nix/ts.nix), and publishes it to its bucket, which the
# mirror's load balancer serves (spec/decisions/website-hosting.md,
# spec/areas/website.md). Pull requests get no preview: CI builds the same
# package and serves it with its headers in the browser test.
#
# Both jobs read the Nix cloud with secrets.NIX_CLOUD_TOKEN, as CI's do. The
# publish job runs in the `Website` environment, which admits only `main`.
# What it needs there:
# - vars.GCP_WORKLOAD_IDENTITY_PROVIDER and vars.GCP_SERVICE_ACCOUNT: the
#   service account scripts/website/provision.sh makes, which may write
#   the bucket's objects and nothing else, through workload identity
#   federation;
# - vars.WEBSITE_BUCKET: that bucket.
# Without them it builds and stops.
#
# Then it checks the live site: headers.json's headers, the cache
# headers, the trailing-slash redirect and the WebAssembly's type. A
# backend bucket provisioned with other headers fails here.

on:
  push:
    branches: [main]
    # The site, the packages it imports, the crates its WASM modules are
    # built from, and what pins their builds: build_test.ts checks that
    # the list keeps up with them.
    paths:
      - apps/website/**
      - packages/wasm/**
      - packages/rpc/**
      - packages/ui/**
      - crates/dassie-base64url/**
      - crates/dassie-identity/**
      - crates/dassie-ilp/**
      - crates/dassie-kit/**
      - crates/dassie-oer/**
      - crates/dassie-stream/**
      - crates/dassie-wasm/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .npmrc
      - tsconfig.base.json
      - nix/ts.nix
      - nix/pnpm.nix
      - nix/registry-mirror.mjs
      - scripts/website/**
      - resources/minisign.pub
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, each to its end; a newer push waits, and only the
# newest waiting one runs.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  # The build, and the third-party code it runs (pnpm's packages, the
  # crates' build scripts), runs in the Nix cloud's sandbox, not here: the
  # runner sends the commit and follows the log. Where CI built the same
  # package for the commit, it is in the cache already.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build on the Nix cloud
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: scripts/nix-cloud-build.sh build "$COMMIT" packages.x86_64-linux.website
      - name: Cancel the build on the Nix cloud
        if: cancelled()
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
        run: scripts/nix-cloud-build.sh cancel

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: Website
    timeout-minutes: 15
    permissions:
      contents: read
      # Workload identity: GitHub's OIDC token is what GCP trusts.
      id-token: write
    steps:
      # The repository's own scripts and headers.json.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The project's cache on the Nix cloud, which only the project's key
      # signs, so it trusts Dassie's builds alone. Anyone may read it;
      # with the token, CI reads all of it, unpinned builds too.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix.vorstand.app/cache/dassie
            extra-trusted-public-keys = nix.vorstand.app-dassie-1:DASSIE_KEY_TODO=
            netrc-file = /etc/nix/netrc
      - name: Nix cloud token
        env:
          NIX_CLOUD_TOKEN: ${{ secrets.NIX_CLOUD_TOKEN }}
        run: printf 'machine nix.vorstand.app login nix password %s\n' "$NIX_CLOUD_TOKEN" | sudo tee /etc/nix/netrc > /dev/null
      # What the build job made, from the cache: with --max-jobs 0, a miss
      # fails rather than building on the runner.
      - name: Fetch the site
        run: nix build .#website --out-link site --max-jobs 0
      - id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Publish
        if: steps.gcp.outcome == 'success'
        env:
          BUCKET: ${{ vars.WEBSITE_BUCKET }}
        run: scripts/website/deploy.sh site "$BUCKET"
      - name: Check the live site
        if: steps.gcp.outcome == 'success'
        run: scripts/website/check.sh https://dassie.land/
      - if: steps.gcp.outcome != 'success'
        run: echo "::notice::Built, not published (no GCP_WORKLOAD_IDENTITY_PROVIDER in the Website environment)"
